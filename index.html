      '<h4>' + esc(m.teamA||m.slotLabelA) + ' vs ' + esc(m.teamB||m.slotLabelB) + '</h4>' +
      '<form data-action="score-form" data-match-id="' + m.id + '">' +
        '<div class="score-teams"><label>' + esc(m.teamA||m.slotLabelA) + '</label><input type="number" min="0" name="scoreA" value="' + (m.scoreA==null?'':m.scoreA) + '"></div>' +
        '<div class="score-teams"><label>' + esc(m.teamB||m.slotLabelB) + '</label><input type="number" min="0" name="scoreB" value="' + (m.scoreB==null?'':m.scoreB) + '"></div>' +
        '<div class="field-row">' +
          '<div><label>Día</label><select name="day">' +
            '<option value=""' + (!m.day ? ' selected' : '') + '>Sin definir</option>' +
            DAY_ORDER.map(function(d){ return '<option value="' + d + '"' + (m.day===d ? ' selected' : '') + '>' + esc(dayLabel(d)) + '</option>'; }).join('') +
          '</select></div>' +
          '<div><label>Cancha</label><input type="text" name="court" value="' + esc(m.court||'') + '"></div>' +
          '<div><label>Horario</label><input type="text" name="time" value="' + esc(m.time||'') + '"></div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-live" type="submit" data-status="vivo">Guardar como EN VIVO</button>' +
          '<button class="btn btn-primary" type="submit" data-status="final">Finalizar partido</button>' +
          (m.status==='final' ? '<button class="btn btn-ghost" type="button" data-action="reopen-match" data-id="' + m.id + '">Reabrir</button>' : '') +
        '</div>' +
      '</form>' +
      (isDraw ? (
        '<div style="margin-top:14px;padding:12px;border:1px dashed var(--border);border-radius:10px">' +
        '<p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-muted)">Empataron. ¿Quién avanzó por definición (penales / shoot-out)?</p>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" type="button" data-action="set-shootout" data-id="' + m.id + '" data-winner="A">Ganó ' + esc(m.teamA) + '</button>' +
          '<button class="btn btn-ghost" type="button" data-action="set-shootout" data-id="' + m.id + '" data-winner="B">Ganó ' + esc(m.teamB) + '</button>' +
        '</div></div>'
      ) : '') +
    '</div>';
    return html;
  }

  function renderTeamsTab(cat){
    return cat.zones.map(function(z){
      var armed = ui.confirmArmed[z.id];
      var rows = z.teams.map(function(t, i){
        return '<div style="display:flex;gap:6px"><input type="text" value="' + esc(t) + '" data-idx="' + i + '"><button class="btn btn-ghost" type="button" data-action="remove-team-row" data-zone="' + z.id + '" data-idx="' + i + '" style="padding:6px 10px">×</button></div>';
      }).join('');
      return '<div class="team-editor">' +
        '<h4>' + esc(z.name) + '</h4>' +
        '<form data-action="teams-form" data-zone-id="' + z.id + '">' +
          '<div class="team-list" data-zone-list="' + z.id + '">' + rows + '</div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-ghost" type="button" data-action="add-team-row" data-zone="' + z.id + '">+ Agregar equipo</button>' +
            '<button class="btn ' + (armed?'btn-danger':'btn-primary') + '" type="submit">' + (armed ? '¿Confirmar? Se pierden los resultados de esta zona' : 'Guardar equipos y armar fixture') + '</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    }).join('');
  }

  function renderTorneoTab(cat){
    return '<form data-action="tournament-form">' +
      '<div class="field-row"><div><label>Nombre del torneo</label><input type="text" name="tournamentName" value="' + esc(STATE.tournamentName) + '"></div></div>' +
      '<div class="field-row"><div><label>Bajada / aclaración</label><input type="text" name="subtitle" value="' + esc(STATE.subtitle||'') + '"></div></div>' +
      '<div class="field-row"><div><label>Nombre de esta categoría</label><input type="text" name="categoryName" value="' + esc(cat.name) + '"></div></div>' +
      '<div class="field-row">' +
        '<div><label>Puntos por victoria</label><input type="text" inputmode="numeric" name="pointsWin" value="' + cat.pointsWin + '"></div>' +
        '<div><label>Puntos por empate</label><input type="text" inputmode="numeric" name="pointsDraw" value="' + cat.pointsDraw + '"></div>' +
        '<div><label>Puntos por derrota</label><input type="text" inputmode="numeric" name="pointsLoss" value="' + cat.pointsLoss + '"></div>' +
      '</div>' +
      '<div class="field-row"><div><label>Código de acceso (organización)</label><input type="text" name="accessCode" value="' + esc(STATE.accessCode||'') + '"></div></div>' +
      '<div class="btn-row"><button class="btn btn-primary" type="submit">Guardar</button></div>' +
    '</form>';
  }

  function renderExcelTab(){
    var sheet = STATE.sheet || {};
    var statusColor = sheetStatus.state==='error' ? 'var(--loss)' : (sheetStatus.state==='ok' ? 'var(--win)' : 'var(--ink-muted)');
    return '' +
      '<p style="font-size:13px;color:var(--ink-muted);margin:0 0 12px">Cargá los resultados de la fase de grupos en tu planilla de Google Sheets, como todos los años. Esta página los toma solos por Categoría + Zona + Equipos (las columnas Cancha y Horario son solo de referencia). Las semifinales, final y tercer puesto se siguen cargando acá, en "Partidos".</p>' +
      (sheet.url ? '<p style="margin:0 0 14px"><a href="' + esc(sheet.url) + '" target="_blank" rel="noopener" style="color:var(--turf-600);font-weight:600">Abrir la planilla en Google Sheets ↗</a></p>' : '<p class="empty-note">Todavía no hay una planilla vinculada.</p>') +
      '<div class="btn-row" style="margin-bottom:10px">' +
        '<button class="btn btn-primary" type="button" data-action="sync-now"' + (sheetStatus.state==='syncing'?' disabled':'') + '>Sincronizar ahora</button>' +
        '<button class="btn ' + (sheet.autoSync ? 'btn-primary' : 'btn-ghost') + '" type="button" data-action="toggle-autosync" data-on="' + (sheet.autoSync ? '0' : '1') + '">' + (sheet.autoSync ? 'Desactivar sincronización automática' : 'Activar sincronización automática') + '</button>' +
      '</div>' +
      '<p style="font-size:12.5px;color:' + statusColor + '">' + esc(sheetStatus.message || 'Sin sincronizar todavía.') + '</p>' +
      (sheetStatus.lastSync ? '<p class="mono" style="font-size:11px;color:var(--ink-muted)">Última sincronización: ' + fmtUpdated(sheetStatus.lastSync) + '</p>' : '');
  }

  function renderModal(){
    var cat = getCategory(ui.adminCategoryId) || STATE.categories[0];
    var selected = ui.selectedMatchId ? cat.matches.find(function(m){ return m.id===ui.selectedMatchId; }) : null;
    var body = '';
    if(ui.modalTab==='partidos'){
      body = selected ? renderScoreForm(cat, selected) : renderPartidosList(cat);
    } else if(ui.modalTab==='equipos'){
      body = renderTeamsTab(cat);
    } else if(ui.modalTab==='excel'){
      body = renderExcelTab();
    } else {
      body = renderTorneoTab(cat);
    }
    return '<div class="modal-overlay" data-action="overlay">' +
      '<div class="modal">' +
        '<div class="modal-head"><h3 class="modal-title">Cargar resultados</h3><button class="modal-close" type="button" data-action="close-admin">×</button></div>' +
        '<div style="padding:10px 16px 0;display:flex;gap:6px;flex-wrap:wrap">' + STATE.categories.map(function(c){
          return '<button class="modal-tab" type="button" aria-selected="' + (c.id===ui.adminCategoryId) + '" data-action="admin-category" data-id="' + c.id + '">' + esc(c.name) + '</button>';
        }).join('') + '</div>' +
        '<div class="modal-tabs">' +
          '<button class="modal-tab" type="button" aria-selected="' + (ui.modalTab==='partidos') + '" data-action="modal-tab" data-tab="partidos">Partidos</button>' +
          '<button class="modal-tab" type="button" aria-selected="' + (ui.modalTab==='equipos') + '" data-action="modal-tab" data-tab="equipos">Equipos</button>' +
          '<button class="modal-tab" type="button" aria-selected="' + (ui.modalTab==='excel') + '" data-action="modal-tab" data-tab="excel">Excel</button>' +
          '<button class="modal-tab" type="button" aria-selected="' + (ui.modalTab==='torneo') + '" data-action="modal-tab" data-tab="torneo">Torneo</button>' +
        '</div>' +
        '<div class="modal-body">' + body + '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- render root ---------------- */
  function render(){
    var app = document.getElementById('app');
    if(!app) return;
    app.innerHTML = renderReadonlyBanner() + renderScorebar() + renderMain() + renderFab() + (ui.gateOpen ? renderGate() : '') + (ui.modalOpen ? renderModal() : '');
  }

  /* ---------------- actions ---------------- */
  function submitScoreForm(form, submitter){
    var matchId = form.dataset.matchId;
    var cat = getCategory(ui.adminCategoryId);
    var m = cat.matches.find(function(x){ return x.id===matchId; });
    if(!m) return;
    var scoreA = parseInt(form.elements['scoreA'].value, 10);
    var scoreB = parseInt(form.elements['scoreB'].value, 10);
    m.scoreA = isNaN(scoreA) ? 0 : scoreA;
    m.scoreB = isNaN(scoreB) ? 0 : scoreB;
    if(form.elements['court']) m.court = form.elements['court'].value;
    if(form.elements['time']) m.time = form.elements['time'].value;
    if(form.elements['day']) m.day = form.elements['day'].value || null;
    m.status = (submitter && submitter.dataset.status) || 'vivo';
    if(m.status==='final' && m.scoreA!==m.scoreB) m.shootoutWinner = null;
    refreshCategory(cat);
    ui.selectedMatchId = null;
    persist('Resultado guardado.');
  }

  function submitTeamsForm(form){
    var zoneId = form.dataset.zoneId;
    var armed = ui.confirmArmed[zoneId];
    if(!armed){
      ui.confirmArmed[zoneId] = true;
      render();
      return;
    }
    var inputs = form.querySelectorAll('[data-zone-list] input[type=text]');
    var names = Array.prototype.map.call(inputs, function(i){ return i.value; });
    var cat = getCategory(ui.adminCategoryId);
    if(names.filter(Boolean).length < 2){
      showToast('Cargá al menos 2 equipos para armar el fixture.', true);
      return;
    }
    regenerateZoneFixture(cat, zoneId, names);
    ui.confirmArmed[zoneId] = false;
    refreshCategory(cat);
    persist('Equipos actualizados y fixture generado.');
  }

  function submitTournamentForm(form){
    var cat = getCategory(ui.adminCategoryId);
    STATE.tournamentName = form.elements['tournamentName'].value || STATE.tournamentName;
    STATE.subtitle = form.elements['subtitle'].value;
    cat.name = form.elements['categoryName'].value || cat.name;
    var pw = parseInt(form.elements['pointsWin'].value, 10);
    var pd = parseInt(form.elements['pointsDraw'].value, 10);
    var pl = parseInt(form.elements['pointsLoss'].value, 10);
    cat.pointsWin = isNaN(pw) ? cat.pointsWin : pw;
    cat.pointsDraw = isNaN(pd) ? cat.pointsDraw : pd;
    cat.pointsLoss = isNaN(pl) ? cat.pointsLoss : pl;
    if(form.elements['accessCode']) STATE.accessCode = form.elements['accessCode'].value || STATE.accessCode;
    persist('Datos del torneo actualizados.');
  }

  function submitGateForm(form){
    var val = (form.elements['code'].value || '').trim().toLowerCase();
    var expected = (STATE.accessCode || '').trim().toLowerCase();
    if(val && expected && val === expected){
      ui.adminUnlocked = true;
      try{ sessionStorage.setItem('hockeyAdminUnlocked', '1'); }catch(e){}
      ui.gateOpen = false; ui.gateError = false;
      ui.modalOpen = true; ui.modalTab = 'partidos'; ui.selectedMatchId = null; ui.adminCategoryId = STATE.activeCategoryId;
      if(STATE.sheet && STATE.sheet.autoSync) startSheetWatch();
      render();
    } else {
      ui.gateError = true;
      render();
    }
  }

  function handleAction(action, ds){
    if(action==='switch-category'){ STATE.activeCategoryId = ds.id; ui.adminCategoryId = ds.id; ui.view='torneo'; render(); }
    else if(action==='show-modalidad'){ ui.view = 'modalidad'; ui.modalidadCategoryId = STATE.activeCategoryId; render(); }
    else if(action==='modalidad-select-category'){ ui.modalidadCategoryId = ds.id; render(); }
    else if(action==='toggle-tv'){
      document.body.classList.toggle('tv-mode');
      if(document.body.classList.contains('tv-mode')){
        tvTimer = setInterval(function(){
          if(STATE.categories.length<2) return;
          ui.tvIndex = (ui.tvIndex+1) % STATE.categories.length;
          STATE.activeCategoryId = STATE.categories[ui.tvIndex].id;
          render();
        }, 15000);
      } else if(tvTimer){ clearInterval(tvTimer); tvTimer=null; }
      render();
    }
    else if(action==='open-admin'){ ui.modalOpen=true; ui.modalTab='partidos'; ui.selectedMatchId=null; ui.adminCategoryId = STATE.activeCategoryId; render(); }
    else if(action==='close-admin'){ ui.modalOpen=false; ui.selectedMatchId=null; render(); }
    else if(action==='overlay'){ /* handled by click target check in listener */ }
    else if(action==='modal-tab'){ ui.modalTab = ds.tab; ui.selectedMatchId=null; render(); }
    else if(action==='admin-category'){ ui.adminCategoryId = ds.id; ui.selectedMatchId=null; render(); }
    else if(action==='select-match'){ ui.selectedMatchId = ds.id; render(); }
    else if(action==='back-to-list'){ ui.selectedMatchId=null; render(); }
    else if(action==='add-team-row'){
      var cat = getCategory(ui.adminCategoryId);
      var zone = cat.zones.find(function(z){ return z.id===ds.zone; });
      zone.teams.push('');
      render();
    }
    else if(action==='remove-team-row'){
      var cat2 = getCategory(ui.adminCategoryId);
      var zone2 = cat2.zones.find(function(z){ return z.id===ds.zone; });
      zone2.teams.splice(parseInt(ds.idx,10), 1);
      render();
    }
    else if(action==='reopen-match'){
      var cat3 = getCategory(ui.adminCategoryId);
      var m3 = cat3.matches.find(function(x){ return x.id===ds.id; });
      if(m3){ m3.status='vivo'; refreshCategory(cat3); persist('Partido reabierto.'); }
    }
    else if(action==='set-shootout'){
      var cat4 = getCategory(ui.adminCategoryId);
      var m4 = cat4.matches.find(function(x){ return x.id===ds.id; });
      if(m4){ m4.shootoutWinner = ds.winner; refreshCategory(cat4); persist('Resultado guardado.'); }
    }
    else if(action==='admin-gate'){ ui.gateOpen=true; ui.gateError=false; render(); }
    else if(action==='close-gate'){ ui.gateOpen=false; render(); }
    else if(action==='sync-now'){ syncNow(); }
    else if(action==='toggle-autosync'){ toggleAutoSync(ds.on==='1'); }
  }

  /* ---------------- boot ---------------- */
  document.addEventListener('click', function(e){
    var overlay = e.target.classList && e.target.classList.contains('modal-overlay');
    if(overlay){
      if(ui.gateOpen){ ui.gateOpen=false; } else { ui.modalOpen=false; ui.selectedMatchId=null; }
      render(); return;
    }
    var el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.tagName==='FORM' || el.type==='submit') return; // handled by the submit listener
    handleAction(el.dataset.action, el.dataset);
  });
  document.addEventListener('submit', function(e){
    var form = e.target;
    if(!form.dataset || !form.dataset.action) return;
    e.preventDefault();
    if(form.dataset.action==='score-form') submitScoreForm(form, e.submitter);
    else if(form.dataset.action==='teams-form') submitTeamsForm(form);
    else if(form.dataset.action==='tournament-form') submitTournamentForm(form);
    else if(form.dataset.action==='gate-form') submitGateForm(form);
  });

  // ---- one-time demo seeding (only present on the very first boot of a fresh
  // tournament; build the fixture from team lists, then apply scripted results) ----
  STATE.categories.forEach(function(cat){
    if(cat.__seedZones){
      cat.__seedZones.forEach(function(sz){ regenerateZoneFixture(cat, sz.zoneId, sz.teams); });
      delete cat.__seedZones;
    }
  });
  STATE.categories.forEach(function(cat){
    if(cat.__seedResults){
      cat.__seedResults.forEach(function(r){
        var m = cat.matches.find(function(x){
          return x.stage==='grupos' && ((x.teamA===r.a && x.teamB===r.b) || (x.teamA===r.b && x.teamB===r.a));
        });
        if(m){
          if(m.teamA===r.a){ m.scoreA=r.scoreA; m.scoreB=r.scoreB; } else { m.scoreA=r.scoreB; m.scoreB=r.scoreA; }
          m.status = r.status || 'final';
        }
      });
      delete cat.__seedResults;
    }
  });
  STATE.categories.forEach(function(c){ refreshCategory(c); });
  STATE.categories.forEach(function(cat){
    if(cat.__seedSemis){
      var semis = cat.matches.filter(function(m){ return m.stage==='semifinal'; });
      cat.__seedSemis.forEach(function(s){
        if(semis[s.index]){ semis[s.index].scoreA=s.scoreA; semis[s.index].scoreB=s.scoreB; semis[s.index].status=s.status; }
      });
      delete cat.__seedSemis;
      refreshCategory(cat);
    }
  });

  ensureCapability();
  if(ui.adminUnlocked && STATE.sheet && STATE.sheet.autoSync){ startSheetWatch(); }
  render();
