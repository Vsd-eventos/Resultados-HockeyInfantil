<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>20° Encuentro Torneo Internacional de Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Marcador en vivo — Hockey — rojo / blanco / negro ===== */
:root{
  --rojo:#D2001F; --rojo-oscuro:#7A0014; --rojo-suave:#FBE1E5;
  --negro:#141212; --gris-900:#1C1A1A; --gris-700:#4A4544;
  --gris-400:#8C8482; --gris-200:#E4DEDD; --gris-100:#F2EEED;
  --blanco:#FFFFFF; --bg:#F5F2F1;
  --shadow:0 1px 2px rgba(20,18,18,.06), 0 6px 18px -10px rgba(20,18,18,.25);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rojo:#FF3B54; --rojo-oscuro:#3A000A; --rojo-suave:#3A1218;
    --negro:#F2EEED; --gris-900:#EDE8E7; --gris-700:#C9C1BF;
    --gris-400:#8C8482; --gris-200:#3A3433; --gris-100:#241F1E;
    --blanco:#1A1717; --bg:#121010;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{ margin:0; background:var(--bg); color:var(--negro); font-family:"Source Sans 3", sans-serif; font-size:15px; line-height:1.45; }
h1,h2,h3{text-wrap:balance} button{font-family:inherit}
.mono{font-family:"IBM Plex Mono", monospace} .tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--rojo); outline-offset:2px}
.wrap{max-width:1000px; margin:0 auto; padding:0 18px 72px}

/* Header */
.topbar{ background:linear-gradient(155deg, var(--negro) 0%, var(--rojo-oscuro) 130%); color:#fff; border-bottom:4px solid var(--rojo); }
.topbar-inner{ max-width:1000px; margin:0 auto; padding:22px 18px 18px; }
.eyebrow{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:#FF8A96; margin:0 0 6px; }
.titulo{ font-family:"Big Shoulders Display", sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:clamp(24px, 5vw, 38px); line-height:1.02; margin:0; }
.top-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
.sync-chip{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:#F1DADD; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:5px 11px; }
.sync-chip.err{ color:#FFD9DC; border-color:#FF3B54; background:rgba(255,59,84,.15); }
.live-chip{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; border-radius:999px; padding:5px 12px 5px 10px; }
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:pulse 1.7s infinite}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,59,84,.6)} 70%{box-shadow:0 0 0 9px rgba(255,59,84,0)} 100%{box-shadow:0 0 0 0 rgba(255,59,84,0)} }

/* Tabs */
.tabbar{ max-width:1000px; margin:0 auto; padding:14px 18px 0; display:flex; gap:8px; }
.tab{ flex:1; text-align:center; border:2px solid var(--negro); background:var(--blanco); color:var(--negro); padding:12px 10px; border-radius:12px; font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:17px; cursor:pointer; }
.tab[aria-selected="true"]{ background:var(--rojo); border-color:var(--rojo); color:#fff; }

/* Day sections */
.section{margin-top:22px}
.day-title{ font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:16px; color:var(--rojo); margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--gris-200); }
.match-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; margin-bottom:20px; }

/* Match card */
.match-card{ border:1px solid var(--gris-200); border-left:4px solid var(--gris-200); border-radius:var(--radius); background:var(--blanco); box-shadow:var(--shadow); padding:12px 14px 12px; }
.match-card.is-vivo{ border-left-color:var(--rojo); }
.match-card.is-final{ border-left-color:var(--negro); }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; flex-wrap:wrap; }
.tag-group{ display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tag{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; border-radius:999px; padding:3px 9px; }
.tag-zona{ background:var(--gris-100); color:var(--gris-700); }
.tag-num{ background:#7A0014; color:#FFFFFF; } /* color fijo: no se invierte en modo oscuro, siempre legible */
.estado{ display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 8px; border-radius:999px; }
.estado.pendiente{ background:var(--gris-100); color:var(--gris-700); }
.estado.vivo{ background:var(--rojo); color:#fff; }
.estado.vivo .live-dot{ background:#fff; }
.estado.final{ background:#141212; color:#FFFFFF; } /* color fijo: --negro se invierte en modo oscuro y dejaba texto blanco sobre fondo casi blanco */

.equipos{ display:flex; flex-direction:column; gap:6px; }
.fila-equipo{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; }
.nombre-equipo{ font-size:14.5px; font-weight:600; color:var(--negro); }
.fila-equipo.gana .nombre-equipo{ color:var(--rojo); font-weight:700; }
.resultado{ font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:23px; min-width:1.3em; text-align:right; color:var(--gris-700); }
.fila-equipo.gana .resultado{ color:var(--rojo); }

.card-meta{ margin-top:9px; padding-top:8px; border-top:1px dashed var(--gris-200); display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--gris-400); }

.empty-note{ font-size:13.5px; color:var(--gris-400); font-style:italic; padding:10px 2px; }
.readonly-banner{ max-width:1000px; margin:14px auto 0; padding:0 18px; font-size:12px; color:var(--gris-400); display:flex; align-items:center; gap:7px; }
.readonly-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--gris-400)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==============================================================================
// CONFIGURACIÓN
// ==============================================================================
// Cada categoría tiene su propia implementación de Apps Script (script
// distinto, atado a su propia planilla), por eso son dos URLs separadas
// en vez de una sola URL + un id de planilla.
const URL_SUB16 = 'https://script.google.com/macros/s/AKfycbzIqUTrre8Xb_am1RSOjbV1Bd3Anh9G4EdloarDVz771hiNrgviJPFI4Ix_QN0iElrt/exec';
const URL_SUB14 = 'https://script.google.com/macros/s/AKfycbyVeS_P_OahYGu3VZm5psxjEqCgydLdXdPUvP6hAtSlB1-PM7UG6eT0uBqhIr5k5jgfyw/exec';

// Intervalo de actualización con "jitter" (variación al azar): si los 1000+
// celulares de la cancha pidieran datos exactamente cada 25s, se generaría
// un pico de tráfico sincronizado cada 25s. Con el jitter, cada celular pide
// en un momento levemente distinto y la carga se reparte en el tiempo.
const INTERVALO_BASE_MS = 22000;
const INTERVALO_JITTER_MS = 9000;

const TOURNAMENT_TITLE = '20° Encuentro Torneo Internacional de Hockey';

function APP(){
  "use strict";

  var state = {
    activeTab: 'sub16',
    matches: { sub16: [], sub14: [] },
    sync: { state:'idle', message:'Conectando...', lastSync:null }
  };

  // --- Helpers de texto ---
  function str(v){ return (v==null ? '' : String(v)).trim(); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Convierte "9:00" / "09:00" a minutos, para ordenar numéricamente
  // (comparar como texto pondría "10:00" antes que "9:00").
  function horaAMinutos(t){
    if(!t) return null;
    var m = String(t).trim().match(/^(\d{1,2}):?(\d{0,2})/);
    if(!m) return null;
    return (parseInt(m[1],10)||0)*60 + (parseInt(m[2],10)||0);
  }

  var DIA_ORDEN = ['vie','sab','dom'];
  var DIA_LABEL = { vie:'Viernes', sab:'Sábado', dom:'Domingo' };
  function diaCodigo(texto){
    var t = String(texto||'').toLowerCase();
    if(t.indexOf('vie')>-1) return 'vie';
    if(t.indexOf('sab')>-1 || t.indexOf('sáb')>-1) return 'sab';
    if(t.indexOf('dom')>-1) return 'dom';
    return '';
  }
  function diaEtiqueta(codigo){ return DIA_LABEL[codigo] || 'Fecha a confirmar'; }
  function diaIndice(codigo){ var i = DIA_ORDEN.indexOf(codigo); return i===-1 ? 99 : i; }

  function fmtHora(iso){
    try{ return new Date(iso).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }catch(e){ return ''; }
  }

  // --- Transforma una fila cruda de la planilla en un partido para mostrar ---
  function filaAPartido(r){
    var teamA = str(r['EquipoA']);
    var teamB = str(r['EquipoB']);
    // Los cruces/copas ya están como filas al final de cada hoja, pero no
    // tienen equipos cargados hasta que se definen por resultado de otros
    // partidos. Mientras no estén los dos nombres, la tarjeta no se muestra.
    if(!teamA || !teamB) return null;

    var gaRaw = str(r['GolesA']);
    var gbRaw = str(r['GolesB']);
    var status = 'pendiente';
    if(gaRaw !== '' && gbRaw !== '') status = 'final';
    else if(gaRaw !== '' || gbRaw !== '') status = 'vivo';

    return {
      zona: str(r['Zona']),
      num: str(r['N°'] || r['Nro'] || r['Nro.'] || r['Numero'] || r['Partido']),
      teamA: teamA, teamB: teamB,
      scoreA: gaRaw === '' ? null : parseInt(gaRaw,10),
      scoreB: gbRaw === '' ? null : parseInt(gbRaw,10),
      status: status,
      dia: diaCodigo(r['Día'] || r['Dia']),
      hora: str(r['Hora']),
      cancha: str(r['Cancha'])
    };
  }

  // --- Fetch a Apps Script sin headers extra: así el pedido es "simple" y
  // el navegador no dispara un preflight CORS, que Apps Script no soporta. ---
  async function fetchPlanilla(urlBase){
    try{
      var url = urlBase + (urlBase.indexOf('?')>-1 ? '&' : '?') + 't=' + Date.now();
      var resp = await fetch(url, { method:'GET', redirect:'follow' });
      if(!resp.ok) return { error: 'HTTP ' + resp.status };
      var texto = await resp.text();
      try{ return JSON.parse(texto); }
      catch(e){ return { error:'El script no devolvió JSON válido.' }; }
    }catch(err){
      return { error:'Bloqueo de red / CORS' };
    }
  }

  async function sincronizar(){
    var r16 = await fetchPlanilla(URL_SUB16);
    var r14 = await fetchPlanilla(URL_SUB14);

    var errores = [];
    var nuevosSub16 = state.matches.sub16, nuevosSub14 = state.matches.sub14;

    if(Array.isArray(r16)){
      nuevosSub16 = r16.map(filaAPartido).filter(Boolean);
    } else {
      errores.push('Sub 16: ' + (r16 && r16.error ? r16.error : 'sin datos'));
    }
    if(Array.isArray(r14)){
      nuevosSub14 = r14.map(filaAPartido).filter(Boolean);
    } else {
      errores.push('Sub 14: ' + (r14 && r14.error ? r14.error : 'sin datos'));
    }

    // Solo volvemos a pintar la pantalla si algo realmente cambió: con
    // cientos de celulares mirando la página, evitar redibujados
    // innecesarios cada 20s ahorra batería y va más fluido.
    var cambio = JSON.stringify(nuevosSub16) !== JSON.stringify(state.matches.sub16) ||
                 JSON.stringify(nuevosSub14) !== JSON.stringify(state.matches.sub14);

    state.matches.sub16 = nuevosSub16;
    state.matches.sub14 = nuevosSub14;

    if(errores.length){
      state.sync = { state:'error', message:'Error al sincronizar — ' + errores.join(' · '), lastSync: state.sync.lastSync };
    } else {
      state.sync = { state:'ok', message:'Sincronizado', lastSync: new Date().toISOString() };
    }

    if(cambio || errores.length) render(); else renderEncabezado();
    programarProximaSync();
  }

  function programarProximaSync(){
    var espera = INTERVALO_BASE_MS + Math.random()*INTERVALO_JITTER_MS;
    setTimeout(sincronizar, espera);
  }

  // --- Render ---
  function renderTarjeta(m){
    var refNum = m.num ? '<span class="tag tag-num">Partido ' + esc(m.num) + '</span>' : '';
    var refZona = m.zona ? '<span class="tag tag-zona">' + esc(m.zona) + '</span>' : '';
    var estadoTxt = m.status==='pendiente' ? 'A jugarse' : (m.status==='vivo' ? '<span class="live-dot"></span> En vivo' : 'Final');
    var ganaA = m.status==='final' && m.scoreA!=null && m.scoreB!=null && m.scoreA > m.scoreB;
    var ganaB = m.status==='final' && m.scoreA!=null && m.scoreB!=null && m.scoreB > m.scoreA;
    var scoreA = m.scoreA==null ? '–' : m.scoreA;
    var scoreB = m.scoreB==null ? '–' : m.scoreB;

    return '' +
      '<div class="match-card is-' + m.status + '">' +
        '<div class="card-head">' +
          '<span class="tag-group">' + refZona + refNum + '</span>' +
          '<span class="estado ' + m.status + '">' + estadoTxt + '</span>' +
        '</div>' +
        '<div class="equipos">' +
          '<div class="fila-equipo' + (ganaA?' gana':'') + '"><span class="nombre-equipo">' + esc(m.teamA) + '</span><span class="resultado tabular">' + scoreA + '</span></div>' +
          '<div class="fila-equipo' + (ganaB?' gana':'') + '"><span class="nombre-equipo">' + esc(m.teamB) + '</span><span class="resultado tabular">' + scoreB + '</span></div>' +
        '</div>' +
        (m.cancha || m.hora ? '<div class="card-meta"><span>' + esc(m.cancha||'') + '</span><span>' + esc(m.hora||'') + '</span></div>' : '') +
      '</div>';
  }

  function ordenarPartidos(lista){
    return lista.slice().sort(function(x,y){
      var hx = horaAMinutos(x.hora), hy = horaAMinutos(y.hora);
      if(hx==null && hy!=null) return 1;
      if(hx!=null && hy==null) return -1;
      if(hx!=null && hy!=null && hx!==hy) return hx-hy;
      var nx = parseInt(x.num,10); if(isNaN(nx)) nx = 0;
      var ny = parseInt(y.num,10); if(isNaN(ny)) ny = 0;
      return nx-ny;
    });
  }

  function renderFixture(lista){
    if(!lista.length) return '<p class="empty-note">Todavía no hay partidos cargados con equipos definidos.</p>';
    var porDia = {};
    lista.forEach(function(m){ (porDia[m.dia] = porDia[m.dia] || []).push(m); });
    var dias = Object.keys(porDia).sort(function(a,b){ return diaIndice(a)-diaIndice(b); });
    return dias.map(function(d){
      var ordenados = ordenarPartidos(porDia[d]);
      return '<div class="section"><h3 class="day-title">' + esc(diaEtiqueta(d)) + '</h3>' +
        '<div class="match-grid">' + ordenados.map(renderTarjeta).join('') + '</div></div>';
    }).join('');
  }

  function contarEnVivo(){
    return state.matches.sub16.filter(function(m){return m.status==='vivo';}).length +
           state.matches.sub14.filter(function(m){return m.status==='vivo';}).length;
  }

  function renderEncabezado(){
    var el = document.getElementById('sync-meta');
    if(!el) return;
    var enVivo = contarEnVivo();
    var esErr = state.sync.state === 'error';
    el.innerHTML =
      (enVivo>0 ? '<span class="live-chip"><span class="live-dot"></span>' + enVivo + ' en vivo</span>' : '') +
      '<span class="sync-chip' + (esErr?' err':'') + '" title="' + esc(state.sync.message) + '">' +
        (state.sync.lastSync ? 'Última actualización: ' + fmtHora(state.sync.lastSync) : 'Conectando...') +
        (esErr ? ' (reintentando)' : '') +
      '</span>';
    var banner = document.getElementById('readonly-msg');
    if(banner) banner.textContent = state.sync.message;
  }

  function render(){
    var app = document.getElementById('app');
    var tabs = [
      {id:'sub16', label:'Sub 16'},
      {id:'sub14', label:'Sub 14'}
    ];
    app.innerHTML =
      '<div class="topbar"><div class="topbar-inner">' +
        '<p class="eyebrow">Marcador en vivo</p>' +
        '<h1 class="titulo">' + esc(TOURNAMENT_TITLE) + '</h1>' +
        '<div class="top-meta" id="sync-meta"></div>' +
      '</div></div>' +
      '<div class="tabbar">' + tabs.map(function(t){
        return '<button class="tab" role="tab" aria-selected="' + (t.id===state.activeTab) + '" data-tab="' + t.id + '" type="button">' + esc(t.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="readonly-banner"><span class="dot"></span><span id="readonly-msg">' + esc(state.sync.message) + '</span></div>' +
      '<div class="wrap">' + renderFixture(state.matches[state.activeTab]) + '</div>';
    renderEncabezado();
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-tab]');
    if(!btn) return;
    state.activeTab = btn.dataset.tab;
    render();
  });

  render();
  sincronizar();
}

APP();
</script>
</body>
</html>
