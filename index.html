<style>
/* ===== Marcador en vivo — torneo de hockey ===== */
:root{
  --bg:#F7F4F3; --surface:#FFFFFF; --surface-2:#F1E7E6; --border:#E3D2D0;
  --ink:#241414; --ink-muted:#6B5958; --turf-700:#7A1418; --turf-600:#EA2427;
  --turf-500:#FF5449; --gold:#D99A00; --gold-soft:#F6E7BF; --gold-ink:#5C4200;
  --plata:#3E6FA8; --plata-soft:#DCE9F6; --plata-ink:#1F3A57; --coral:#D9502A;
  --coral-soft:#F7DCD1; --win:#1F7A43; --win-soft:#DFF0E4; --draw:#8A7A22;
  --draw-soft:#F1EBCF; --loss:#B23A3A; --loss-soft:#F6DEDE;
  --shadow:0 1px 2px rgba(40,10,10,.07), 0 8px 24px -12px rgba(40,10,10,.2);
  --radius:14px; --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#180E0D; --surface:#211615; --surface-2:#2A1A19; --border:#3C2A28;
    --ink:#F2E9E8; --ink-muted:#B09B99; --turf-700:#2A0A0A; --turf-600:#FF5449;
    --turf-500:#FF8478; --gold:#EFB93B; --gold-soft:#3A2E0E; --gold-ink:#F6E2A6;
    --plata:#7FA8E0; --plata-soft:#1E2E40; --plata-ink:#D7E6F5; --coral:#FF7A52;
    --coral-soft:#3A2016; --win:#3FAE71; --win-soft:#173425; --draw:#CBB84E;
    --draw-soft:#332C10; --loss:#E56A6A; --loss-soft:#3A1D1D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3", sans-serif; font-size:15px; line-height:1.45; }
h1,h2,h3{text-wrap:balance} img{max-width:100%} button{font-family:inherit}
.mono{font-family:"IBM Plex Mono", monospace} .tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 96px}
.scorebar{ background:linear-gradient(180deg, var(--turf-700), var(--turf-600)); color:#F3F7EF; border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:30; }
.scorebar-inner{ max-width:1080px; margin:0 auto; padding:16px 20px 14px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; }
.brand-block{display:flex; align-items:center; gap:14px}
.sponsor-logo{ height:50px; width:auto; border-radius:9px; display:block; border:2px solid rgba(255,255,255,.85); box-shadow:0 4px 12px -4px rgba(0,0,0,.5); }
.brand-eyebrow{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 4px; }
.brand-title{ font-family:"Big Shoulders Display", sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:clamp(26px, 4vw, 40px); line-height:.98; margin:0; }
.brand-sub{margin:6px 0 0; font-size:13.5px; color:#F0D8D5; max-width:52ch}
.scorebar-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.updated-chip{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:#F0D8D5; border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 10px; }
.live-chip{ display:inline-flex; align-items:center; gap:7px; background:rgba(217,80,42,.18); border:1px solid var(--coral); color:#FFDFD2; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; border-radius:999px; padding:5px 11px 5px 9px; }
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--coral); box-shadow:0 0 0 0 rgba(217,80,42,.6); animation:pulse 1.8s infinite}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(217,80,42,.55)} 70%{box-shadow:0 0 0 8px rgba(217,80,42,0)} 100%{box-shadow:0 0 0 0 rgba(217,80,42,0)} }
.tv-btn{ border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06); color:#F3F7EF; border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.tv-btn:hover{background:rgba(255,255,255,.14)}
.tabbar{max-width:1080px; margin:0 auto; padding:10px 20px 0; display:flex; gap:8px; flex-wrap:wrap}
.tab{ border:1px solid rgba(255,255,255,.22); background:transparent; color:#F1DCDA; padding:8px 14px; border-radius:999px 999px 0 0; font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:none; }
.tab[aria-selected="true"]{background:var(--bg); color:var(--turf-600); border-color:var(--bg)}
.tab-info{margin-left:auto; border-style:dashed; opacity:.9} .tab-info[aria-selected="true"]{opacity:1}
.section{margin-top:28px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
.section-title{ font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:19px; color:var(--turf-600); margin:0; }
.section-note{font-size:12.5px; color:var(--ink-muted)}
.zone-block{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 16px 18px; margin-bottom:16px; }
.zone-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.zone-name{ font-family:"Big Shoulders Display", sans-serif; font-size:17px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--turf-600); margin:0; }
.zone-tag{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted)}
.day-block{margin-bottom:22px} .day-block:last-child{margin-bottom:0}
.day-title{ font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:15px; color:var(--ink-muted); margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.match-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px}
.match-card{ border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:11px 12px 10px; position:relative; }
.match-card.is-live{border-color:var(--coral)}
.match-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.match-card-head .match-status{margin-bottom:0}
.match-card-tags{display:inline-flex; align-items:center; gap:6px}
.match-zone-tag{ font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); background:var(--surface-2); border-radius:999px; padding:3px 8px; }
.match-num-tag{ font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--turf-600); background:var(--coral-soft); border-radius:999px; padding:3px 8px; }
.match-status{ display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; margin-bottom:8px; }
.match-status.pendiente{background:var(--surface-2); color:var(--ink-muted)}
.match-status.vivo{background:var(--coral-soft); color:var(--coral)}
.match-status.vivo .live-dot{background:var(--coral)}
.match-status.final{background:var(--win-soft); color:var(--win)}
.match-teams{display:flex; flex-direction:column; gap:5px}
.match-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.match-team{font-size:14px; font-weight:600; color:var(--ink)}
.match-row.win .match-team{color:var(--turf-600)}
.match-score{ font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:22px; min-width:1.4em; text-align:right; color:var(--ink); }
.match-row.win .match-score{color:var(--turf-600)}
.match-meta{ margin-top:8px; padding-top:7px; border-top:1px dashed var(--border); display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-muted); }
.standings-wrap{overflow-x:auto; margin-top:4px}
table.standings{border-collapse:collapse; width:100%; min-width:480px; font-size:13px}
table.standings th, table.standings td{padding:7px 8px; text-align:center; white-space:nowrap}
table.standings th{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); border-bottom:1px solid var(--border); font-weight:600; }
table.standings td.team{text-align:left; font-weight:600}
table.standings td.pts{font-weight:800; color:var(--turf-600)}
table.standings tbody tr{border-bottom:1px solid var(--border)}
table.standings tbody tr:last-child{border-bottom:none}
table.standings tbody tr.qualifies td.team{position:relative; padding-left:14px}
table.standings tbody tr.qualifies td.team::before{ content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:2px; background:var(--gold); }
.pos{font-family:"IBM Plex Mono",monospace; color:var(--ink-muted)}
.bracket{display:flex; gap:22px; align-items:center; overflow-x:auto; padding:6px 2px 10px}
.bracket-col{display:flex; flex-direction:column; gap:16px; min-width:210px}
.bracket-col.final-col{justify-content:center}
.bracket-label{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:2px; }
.bracket-slot{ border:1px solid var(--border); border-radius:10px; background:var(--surface); padding:9px 10px; box-shadow:var(--shadow); }
.bracket-slot .match-row{padding:2px 0}
.bracket-slot .match-team{font-size:13px}
.bracket-slot .match-score{font-size:18px}
.bracket-placeholder{ border:1px dashed var(--border); border-radius:10px; padding:12px 10px; text-align:center; font-size:12px; color:var(--ink-muted); font-style:italic; }
.third-place{margin-top:14px} .third-place .bracket-slot{max-width:280px}
.bracket-round{margin-bottom:18px} .bracket-round:last-child{margin-bottom:0}
.bracket-round-title{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin:0 0 8px; }
.cup-block{margin-bottom:26px} .cup-block:last-child{margin-bottom:0}
.cup-title{ font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:18px; color:var(--turf-600); margin:0 0 12px; padding-bottom:6px; border-bottom:2px solid var(--border); }
.readonly-banner{ max-width:1080px; margin:14px auto 0; padding:10px 20px; font-size:12.5px; color:var(--ink-muted); display:flex; align-items:center; gap:8px; }
.readonly-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-muted)}
.empty-note{font-size:13px; color:var(--ink-muted); font-style:italic; padding:8px 2px}
body.tv-mode{font-size:calc(15px * var(--scale))}
body.tv-mode .tabbar{display:none}
body.tv-mode .wrap{max-width:1400px}
body.tv-mode .brand-title{font-size:clamp(34px, 5vw, 56px)}
body.tv-mode .sponsor-logo{height:72px}
@media (max-width:480px){ .sponsor-logo{height:38px} }
body.tv-mode .section-title{font-size:24px}
body.tv-mode .zone-name{font-size:21px}
body.tv-mode .match-team{font-size:16px}
body.tv-mode .match-score{font-size:27px}
body.tv-mode table.standings{font-size:15px}
.mod-cat-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.mod-cat-btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer;}
.mod-cat-btn[aria-selected="true"]{background:var(--turf-600); color:#fff; border-color:var(--turf-600)}
.mod-card{ display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;}
.mod-step{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--turf-600); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:15px;}
.mod-copy{min-width:0}
.mod-copy h4{ margin:0 0 6px; font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.01em; font-size:16px; color:var(--turf-600);}
.mod-copy p{margin:0 0 10px; font-size:13.5px; color:var(--ink); line-height:1.55}
.cross-diagram{width:100%; height:auto; margin:6px 0 4px; display:block}
.cross-diagram .cd-col-label{ fill:var(--turf-600); font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.02em; text-anchor:middle;}
.cross-diagram .cd-box{fill:var(--surface); stroke:var(--border); stroke-width:1.5}
.cross-diagram .cd-badge-bg{fill:var(--turf-600)}
.cross-diagram .cd-badge-text{ fill:#fff; font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:15px; text-anchor:middle; dominant-baseline:central;}
.cross-diagram .cd-line{stroke:var(--turf-600); stroke-width:2.5; opacity:.55}
.cross-diagram .cd-line-straight{stroke:var(--ink-muted); stroke-width:2.5; opacity:.55; stroke-dasharray:5 4}
</style>

<script>
// ==============================================================================
// CONFIGURACIÓN (APPS SCRIPT)
// Reemplaza TU_URL_APPS_SCRIPT por la URL de tu Apps Script
// ==============================================================================
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxXZAUCAKEeR_ygVVJr9S6jZHToaZVTJ3rgCPb9Kb3e32SnFsaLzBQTI_awZq3agWAC/exec';

// Pega aquí solo la mezcla de letras y números del ID de cada planilla de Google Sheets
const ID_PLANILLA_SUB16 = '1qosQZas3b7bpQXRlB21AMk4bATFm88-P5FTnws1gBQM';
const ID_PLANILLA_SUB14 = '1W22MF_O_DjRzpZWQo78OjjMJeS7hlpTqWaWFBVAoAqs';

const INTERVALO_ACTUALIZACION = 15000; // 15 segundos

function APP(STATE){
  "use strict";

  var ui = { view:'torneo', modalidadCategoryId: STATE.activeCategoryId, tvIndex:0 };
  var tvTimer = null;
  var sheetWatchUnsub = null;
  var sheetStatus = { state:'idle', message:'Conectando a Google Sheets en tiempo real...', lastSync:null };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function getCategory(id){ return STATE.categories.find(function(c){ return c.id===id; }); }

  var DAY_ORDER = ['vie','sab','dom'];
  var DAY_LABELS = { vie:'Viernes 25/9', sab:'Sábado 26/9', dom:'Domingo 27/9' };
  function dayLabel(code){ return DAY_LABELS[code] || 'Fecha a confirmar'; }
  function dayIndex(code){ var i = DAY_ORDER.indexOf(code); return i===-1 ? 99 : i; }

  function fmtUpdated(iso){
    try{ var d = new Date(iso); return d.toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', second: '2-digit'}); }catch(e){ return ''; }
  }

  function groupMatches(cat, zoneId){ return cat.matches.filter(function(m){ return m.stage==='grupos' && m.zoneId===zoneId; }); }
  function zoneComplete(cat, zoneId){
    var gm = groupMatches(cat, zoneId);
    return gm.length>0 && gm.every(function(m){ return m.status==='final'; });
  }
  function computeStandingsGeneric(matches, teamNames, pointsWin, pointsDraw, pointsLoss){
    var table = {};
    teamNames.forEach(function(t){ table[t] = {team:t, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,dg:0,pts:0}; });
    matches.forEach(function(m){
      if(m.status!=='final' || m.scoreA==null || m.scoreB==null) return;
      var a = table[m.teamA], b = table[m.teamB];
      if(!a || !b) return;
      a.pj++; b.pj++;
      a.gf += m.scoreA; a.gc += m.scoreB;
      b.gf += m.scoreB; b.gc += m.scoreA;
      if(m.scoreA > m.scoreB){ a.pg++; a.pts += pointsWin; b.pp++; b.pts += pointsLoss; }
      else if(m.scoreB > m.scoreA){ b.pg++; b.pts += pointsWin; a.pp++; a.pts += pointsLoss; }
      else { a.pe++; b.pe++; a.pts += pointsDraw; b.pts += pointsDraw; }
    });
    Object.keys(table).forEach(function(k){ table[k].dg = table[k].gf - table[k].gc; });
    
    function headToHead(teamX, teamY){
      var diff = 0;
      matches.forEach(function(m){
        if(m.status!=='final' || m.scoreA==null || m.scoreB==null) return;
        if(m.teamA===teamX && m.teamB===teamY) diff += (m.scoreA - m.scoreB);
        else if(m.teamA===teamY && m.teamB===teamX) diff += (m.scoreB - m.scoreA);
      });
      return diff;
    }
    
    return Object.values(table).sort(function(x,y){
      if(y.pts!==x.pts) return y.pts-x.pts;
      if(y.pg!==x.pg) return y.pg-x.pg;
      if(y.dg!==x.dg) return y.dg-x.dg;
      if(y.gf!==x.gf) return y.gf-x.gf;
      var h2h = headToHead(x.team, y.team);
      if(h2h!==0) return -h2h;
      return x.team.localeCompare(y.team, 'es');
    });
  }
  function computeStandings(cat, zone){ return computeStandingsGeneric(groupMatches(cat, zone.id), zone.teams, cat.pointsWin, cat.pointsDraw, cat.pointsLoss); }

  function winnerOf(m){
    if(m.status!=='final' || m.scoreA==null || m.scoreB==null) return null;
    if(m.scoreA > m.scoreB) return 'A';
    if(m.scoreB > m.scoreA) return 'B';
    if(m.shootoutWinner) return m.shootoutWinner;
    return null;
  }
  function winnerName(m){ var w=winnerOf(m); return w==='A'?m.teamA:(w==='B'?m.teamB:null); }
  function loserName(m){ var w=winnerOf(m); if(!w) return null; return w==='A'?m.teamB:m.teamA; }

  function computeTier(cat, tier){
    if(!cat.zones.length) return null;
    var allComplete = cat.zones.every(function(z){ return zoneComplete(cat, z.id); });
    if(!allComplete) return null;
    var rows = [];
    cat.zones.forEach(function(z){
      var st = computeStandings(cat, z);
      var row = st[tier-1];
      if(row) rows.push(row);
    });
    rows.sort(function(x,y){
      if(y.pts!==x.pts) return y.pts-x.pts;
      if(y.pg!==x.pg) return y.pg-x.pg;
      if(y.dg!==x.dg) return y.dg-x.dg;
      if(y.gf!==x.gf) return y.gf-x.gf;
      return x.team.localeCompare(y.team, 'es');
    });
    return rows;
  }
  function resolveSource(cat, src){
    if(!src) return null;
    if(src.k==='zonePos'){
      var zone = cat.zones.find(function(z){ return z.id===src.zoneId; });
      if(!zone || !zoneComplete(cat, zone.id)) return null;
      var st = computeStandings(cat, zone);
      var row = st[src.pos-1];
      return row ? row.team : null;
    }
    if(src.k==='tier'){
      var pool = computeTier(cat, src.tier);
      if(!pool) return null;
      var row = pool[src.rank-1];
      return row ? row.team : null;
    }
    if(src.k==='win' || src.k==='lose'){
      var m = cat.matches.find(function(x){ return x.key===src.ref; });
      if(!m) return null;
      var w = winnerOf(m);
      if(!w) return null;
      if(src.k==='win') return w==='A' ? m.teamA : m.teamB;
      return w==='A' ? m.teamB : m.teamA;
    }
    return null;
  }

  function Zp(zoneId, pos, label){ return {src:{k:'zonePos', zoneId:zoneId, pos:pos}, label:label}; }
  function Tr(tier, rank, label){ return {src:{k:'tier', tier:tier, rank:rank}, label:label}; }
  function Wn(key){ return {src:{k:'win', ref:key}, label:'Ganador P.' + key}; }
  function Ls(key){ return {src:{k:'lose', ref:key}, label:'Perdedor P.' + key}; }

  function buildBracketSpecs(cat){
    if(cat.format==='cruce2zonas'){
      var zA = cat.zones[0], zB = cat.zones[1];
      if(!zA || !zB) return null;
      return [
        {key:'21', group:'llave', round:'Definición 9°-10° (ida)', A:Zp(zA.id,5,'5° '+zA.name), B:Zp(zB.id,5,'5° '+zB.name)},
        {key:'22', group:'llave', round:'Cruce', A:Zp(zA.id,3,'3° '+zA.name), B:Zp(zB.id,4,'4° '+zB.name)},
        {key:'23', group:'llave', round:'Cruce', A:Zp(zB.id,3,'3° '+zB.name), B:Zp(zA.id,4,'4° '+zA.name)},
        {key:'24', group:'llave', round:'Cruce', A:Zp(zA.id,1,'1° '+zA.name), B:Zp(zB.id,2,'2° '+zB.name)},
        {key:'25', group:'llave', round:'Cruce', A:Zp(zB.id,1,'1° '+zB.name), B:Zp(zA.id,2,'2° '+zA.name)},
        {key:'26', group:'llave', round:'Definición 9°-10° (vuelta)', A:Zp(zA.id,5,'5° '+zA.name), B:Zp(zB.id,5,'5° '+zB.name), posWin:9, posLose:10},

  function syncPlayoffTeams(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return;
    specs.forEach(function(spec){
      var teamA = resolveSource(cat, spec.A.src);
      var teamB = resolveSource(cat, spec.B.src);
      var m = cat.matches.find(function(x){ return x.key===spec.key; });
      if(!m) return;
      m.slotLabelA = spec.A.label; m.slotLabelB = spec.B.label;
      m.groupKey = spec.group; m.roundLabel = spec.round;
      m.posWin = spec.posWin || null; m.posLose = spec.posLose || null;
      var changed = (teamA!==m.teamA) || (teamB!==m.teamB);
      if(changed && m.status!=='pendiente'){
        m.status = 'pendiente'; m.scoreA = null; m.scoreB = null; m.shootoutWinner = null;
      }
      m.teamA = teamA; m.teamB = teamB;
    });
  }

  function computeEstimuloStandings(cat){
    if(cat.format==='copas4zonas'){
      if(!cat.zones.every(function(z){ return zoneComplete(cat, z.id); })) return null;
      var teams = cat.zones.map(function(z){ var st = computeStandings(cat, z); return st[4] ? st[4].team : null; });
      if(teams.some(function(t){ return !t; })) return null;
      var matches = cat.matches.filter(function(m){ return m.groupKey==='estimulo'; });
      return computeStandingsGeneric(matches, teams, cat.pointsWin, cat.pointsDraw, cat.pointsLoss);
    }
    return null;
  }

  function computeFinalStandings(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return null;
    var result = [];
    specs.forEach(function(spec){
      if(spec.posWin==null) return;
      var m = cat.matches.find(function(x){ return x.key===spec.key; });
      var w = m ? winnerOf(m) : null;
      result.push({pos:spec.posWin, team: w ? (w==='A'?m.teamA:m.teamB) : null});
      result.push({pos:spec.posLose, team: w ? (w==='A'?m.teamB:m.teamA) : null});
    });
    if(cat.format==='copas4zonas'){
      var est = computeEstimuloStandings(cat);
      for(var p=17;p<=20;p++){ result.push({pos:p, team: est ? (est[p-17] && est[p-17].team) : null}); }
    }
    result.sort(function(a,b){ return a.pos-b.pos; });
    return result;
  }

  function refreshCategory(cat){ syncPlayoffTeams(cat); }

  // --- Integración con Google Apps Script ---
  function applySheetRows(rows){
    var changed = false;
    rows.forEach(function(r){
      var catName = (r['Categoria']||'').trim();
      var zoneName = (r['Zona']||'').trim();
      var teamA = (r['EquipoA']||'').trim();
      var teamB = (r['EquipoB']||'').trim();
      
      if(!catName || !teamA || !teamB) return;
      
      var cat = STATE.categories.find(function(c){ return c.name.trim().toLowerCase()===catName.toLowerCase(); });
      if(!cat) return;
      
      // Buscamos TODOS los partidos en los que se enfrenten estos dos equipos (pueden cruzarse en zona y en final)
      var matchingMatches = cat.matches.filter(function(x){
        return (x.teamA===teamA && x.teamB===teamB) || (x.teamA===teamB && x.teamB===teamA);
      });
      
      if(!matchingMatches.length) return;
      
      var m = matchingMatches[0]; // Por defecto agarra el primero que encuentre
      
      // Si en el Excel especificaste una Zona, buscamos el partido exacto que corresponda a esa zona
      if (zoneName !== "") {
         var exactMatch = matchingMatches.find(function(x) {
             var catZone = cat.zones.find(function(z) { return z.id === x.zoneId; });
             return catZone && catZone.name.toLowerCase() === zoneName.toLowerCase();
         });
         if (exactMatch) m = exactMatch;
      }
      
      var gaRaw = (r['GolesA']==null ? '' : String(r['GolesA']).trim());
      var gbRaw = (r['GolesB']==null ? '' : String(r['GolesB']).trim());
      
      // ESTADO AUTOMÁTICO BASADO EN GOLES
      var status = 'pendiente';
      if(gaRaw !== '' && gbRaw !== '') {
        status = 'final';
      } else if(gaRaw !== '' || gbRaw !== '') {
        status = 'vivo';
      }
      
      var gaNum = gaRaw==='' ? null : parseInt(gaRaw, 10);
      var gbNum = gbRaw==='' ? null : parseInt(gbRaw, 10);
      
      var newScoreA = m.teamA===teamA ? gaNum : gbNum;
      var newScoreB = m.teamA===teamA ? gbNum : gaNum;
      
      if(m.scoreA!==newScoreA || m.scoreB!==newScoreB || m.status!==status){
        m.scoreA = newScoreA; m.scoreB = newScoreB; m.status = status;
        if(status!=='final') m.shootoutWinner = null;
        changed = true;
      }
    });
    return changed;
  }

  async function syncNow() {
    try {
      if(!ID_PLANILLA_SUB16 || !ID_PLANILLA_SUB14) {
         sheetStatus = { state:'error', message: 'Falta configurar los IDs de las planillas', lastSync: sheetStatus.lastSync };
         render(); return;
      }

      // Agregamos un timestamp a la URL para forzar al navegador a que no use caché
      const [res16, res14] = await Promise.all([
        fetch(URL_SCRIPT + '?id=' + ID_PLANILLA_SUB16 + '&t=' + Date.now()),
        fetch(URL_SCRIPT + '?id=' + ID_PLANILLA_SUB14 + '&t=' + Date.now())
      ]);
      
      if(!res16.ok || !res14.ok) throw new Error('Error al conectar con el servidor');
      
      const rows16 = await res16.json();
      const rows14 = await res14.json();
      
      if(rows16.error) throw new Error('Sub16: ' + rows16.error);
      if(rows14.error) throw new Error('Sub14: ' + rows14.error);
      
      // Inyectamos la categoría porque la planilla de origen no la tiene
      rows16.forEach(r => r['Categoria'] = 'Sub 16');
      rows14.forEach(r => r['Categoria'] = 'Sub 14');
      
      const allRows = rows16.concat(rows14);
      const changed = applySheetRows(allRows);
      
      if(changed) {
          STATE.updatedAt = new Date().toISOString();
          STATE.categories.forEach(c => refreshCategory(c));
      }
      
      sheetStatus = { state:'ok', message: 'Sincronizado en tiempo real', lastSync: new Date().toISOString() };
      render();
    } catch(err) {
      console.error(err);
      sheetStatus = { state:'error', message: err.message || 'Error de conexión', lastSync: sheetStatus.lastSync };
      render();
    }
  }

  function startSheetWatch(){
    if(sheetWatchUnsub) return;
    syncNow();
    sheetWatchUnsub = setInterval(syncNow, INTERVALO_ACTUALIZACION);
  }

      '<div class="section"><div class="section-head"><h2 class="section-title">Posiciones</h2><span class="section-note">Tabla de cada zona</span></div>' +
        cat.zones.map(function(z){ return renderStandingsBlock(cat, z); }).join('') + '</div>' +
      '<div class="section"><div class="section-head"><h2 class="section-title">' + esc(crossTitle) + '</h2></div>' +
        renderBracketFixtureSection(cat) + '</div>' +
    '</div>';
  }

  /* ---------------- "¿Cómo se juega?" explainer ---------------- */
  function renderModalidad(cat){
    var picker = STATE.categories.map(function(c){ return '<button class="mod-cat-btn" role="tab" aria-selected="' + (c.id===cat.id) + '" data-action="modalidad-select-category" data-id="' + c.id + '" type="button">' + esc(c.name) + '</button>'; }).join('');
    var body = cat.format==='cruce2zonas' ? renderModalidadCruce(cat) : (cat.format==='copas4zonas' ? renderModalidadCopas4(cat) : '');
    return '<div class="section"><div class="section-head"><h2 class="section-title">¿Cómo se juega?</h2></div><div class="mod-cat-picker">' + picker + '</div>' + body + '</div>';
  }

  function renderModalidadCruce(cat){
    return '<div class="mod-card"><div class="mod-step">1</div><div class="mod-copy"><h4>Fase de grupos</h4><p>Los equipos se dividen en 2 zonas. Juegan todos contra todos.</p></div></div>' +
           '<div class="mod-card"><div class="mod-step">2</div><div class="mod-copy"><h4>Cruce de posiciones</h4><p>Terminada la fase de grupos, el 1° de la A juega con el 2° de la B (y viceversa). Los ganadores de esos cruces van a la Final.</p></div></div>';
  }
  function renderModalidadCopas4(cat){
    return '<div class="mod-card"><div class="mod-step">1</div><div class="mod-copy"><h4>Fase de grupos</h4><p>Los equipos se dividen en 4 zonas y juegan todos contra todos.</p></div></div>' +
           '<div class="mod-card"><div class="mod-step">2</div><div class="mod-copy"><h4>Armado de Copas</h4><p>Los 1° y 2° de cada zona van a Copa Oro (8 equipos). Los 3° y 4° a Copa Plata (8 equipos). El 5° de cada zona juega un cuadrangular por la Copa Estímulo.</p></div></div>' +
           '<div class="mod-card"><div class="mod-step">3</div><div class="mod-copy"><h4>Playoffs (Oro y Plata)</h4><p>Juegan cuartos de final, semis y final. Quienes pierden sus partidos también siguen jugando para definir los puestos de más abajo.</p></div></div>';
  }

  function render(){
    var app = document.getElementById('app');
    if(app) app.innerHTML = renderScorebar() + renderMain();
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action==='switch-category'){ STATE.activeCategoryId = el.dataset.id; ui.view='torneo'; render(); }
    else if(action==='show-modalidad'){ ui.view = 'modalidad'; ui.modalidadCategoryId = STATE.activeCategoryId; render(); }
    else if(action==='modalidad-select-category'){ ui.modalidadCategoryId = el.dataset.id; render(); }
    else if(action==='toggle-tv'){
      document.body.classList.toggle('tv-mode');
      if(document.body.classList.contains('tv-mode')){
        tvTimer = setInterval(function(){
          ui.tvIndex = (ui.tvIndex+1) % STATE.categories.length;
          STATE.activeCategoryId = STATE.categories[ui.tvIndex].id; render();
        }, 15000);
      } else if(tvTimer){ clearInterval(tvTimer); tvTimer=null; }
      render();
    }
  });

  // BOOT
  startSheetWatch();
}
