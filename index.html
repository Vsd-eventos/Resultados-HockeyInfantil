<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marcador de Hockey en Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Marcador en vivo — torneo de hockey ===== */

:root{
  --bg:#F7F4F3;
  --surface:#FFFFFF;
  --surface-2:#F1E7E6;
  --border:#E3D2D0;
  --ink:#241414;
  --ink-muted:#6B5958;
  --turf-700:#7A1418;
  --turf-600:#EA2427;
  --turf-500:#FF5449;
  --gold:#D99A00;
  --gold-soft:#F6E7BF;
  --gold-ink:#5C4200;
  --plata:#3E6FA8;
  --plata-soft:#DCE9F6;
  --plata-ink:#1F3A57;
  --coral:#D9502A;
  --coral-soft:#F7DCD1;
  --win:#1F7A43;
  --win-soft:#DFF0E4;
  --draw:#8A7A22;
  --draw-soft:#F1EBCF;
  --loss:#B23A3A;
  --loss-soft:#F6DEDE;
  --shadow:0 1px 2px rgba(40,10,10,.07), 0 8px 24px -12px rgba(40,10,10,.2);
  --radius:14px;
  --scale:1;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#180E0D;
    --surface:#211615;
    --surface-2:#2A1A19;
    --border:#3C2A28;
    --ink:#F2E9E8;
    --ink-muted:#B09B99;
    --turf-700:#2A0A0A;
    --turf-600:#FF5449;
    --turf-500:#FF8478;
    --gold:#EFB93B;
    --gold-soft:#3A2E0E;
    --gold-ink:#F6E2A6;
    --plata:#7FA8E0;
    --plata-soft:#1E2E40;
    --plata-ink:#D7E6F5;
    --coral:#FF7A52;
    --coral-soft:#3A2016;
    --win:#3FAE71;
    --win-soft:#173425;
    --draw:#CBB84E;
    --draw-soft:#332C10;
    --loss:#E56A6A;
    --loss-soft:#3A1D1D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#180E0D;
  --surface:#211615;
  --surface-2:#2A1A19;
  --border:#3C2A28;
  --ink:#F2E9E8;
  --ink-muted:#B09B99;
  --turf-700:#2A0A0A;
  --turf-600:#FF5449;
  --turf-500:#FF8478;
  --gold:#EFB93B;
  --gold-soft:#3A2E0E;
  --gold-ink:#F6E2A6;
  --plata:#7FA8E0;
  --plata-soft:#1E2E40;
  --plata-ink:#D7E6F5;
  --coral:#FF7A52;
  --coral-soft:#3A2016;
  --win:#3FAE71;
  --win-soft:#173425;
  --draw:#CBB84E;
  --draw-soft:#332C10;
  --loss:#E56A6A;
  --loss-soft:#3A1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px;
  line-height:1.45;
}
h1,h2,h3{text-wrap:balance}
img{max-width:100%}
button{font-family:inherit}
.mono{font-family:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace}
.tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}

/* ---------- layout shell ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 96px}

/* ---------- header / scoreboard bar ---------- */
.scorebar{
  background:linear-gradient(180deg, var(--turf-700), var(--turf-600));
  color:#F3F7EF;
  border-bottom:3px solid var(--gold);
  position:sticky; top:0; z-index:30;
}
.scorebar-inner{
  max-width:1080px; margin:0 auto; padding:16px 20px 14px;
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px;
}
.brand-block{display:flex; align-items:center; gap:14px}
.sponsor-logo{
  height:50px; width:auto; border-radius:9px; display:block;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 4px 12px -4px rgba(0,0,0,.5);
}
.brand-eyebrow{
  font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold); margin:0 0 4px;
}
.brand-title{
  font-family:"Big Shoulders Display", "Archivo Black", sans-serif;
  font-weight:800; text-transform:uppercase; letter-spacing:.01em;
  font-size:clamp(26px, 4vw, 40px); line-height:.98; margin:0;
}
.brand-sub{margin:6px 0 0; font-size:13.5px; color:#F0D8D5; max-width:52ch}
.scorebar-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.updated-chip{
  font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:#F0D8D5;
  border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 10px;
}
.live-chip{
  display:inline-flex; align-items:center; gap:7px;
  background:rgba(217,80,42,.18); border:1px solid var(--coral);
  color:#FFDFD2; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
  border-radius:999px; padding:5px 11px 5px 9px;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--coral); box-shadow:0 0 0 0 rgba(217,80,42,.6); animation:pulse 1.8s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(217,80,42,.55)}
  70%{box-shadow:0 0 0 8px rgba(217,80,42,0)}
  100%{box-shadow:0 0 0 0 rgba(217,80,42,0)}
}
.tv-btn{
  border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06); color:#F3F7EF;
  border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.tv-btn:hover{background:rgba(255,255,255,.14)}

/* category tabs */
.tabbar{max-width:1080px; margin:0 auto; padding:10px 20px 0; display:flex; gap:8px; flex-wrap:wrap}
.tab{
  border:1px solid rgba(255,255,255,.22); background:transparent; color:#F1DCDA;
  padding:8px 14px; border-radius:999px 999px 0 0; font-size:13.5px; font-weight:600; cursor:pointer;
  border-bottom:none;
}
.tab[aria-selected="true"]{background:var(--bg); color:var(--turf-600); border-color:var(--bg)}
.tab-info{margin-left:auto; border-style:dashed; opacity:.9}
.tab-info[aria-selected="true"]{opacity:1}

/* ---------- section shell ---------- */
.section{margin-top:28px}

/* ---------- "¿Cómo se juega?" explainer ---------- */
.mod-cat-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.mod-cat-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);
  padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer;
}
.mod-cat-btn:hover{background:var(--surface-2)}
.mod-cat-btn[aria-selected="true"]{background:var(--turf-600); color:#fff; border-color:var(--turf-600)}
.mod-card{
  display:flex; gap:14px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;
}
.mod-step{
  flex:none; width:30px; height:30px; border-radius:50%; background:var(--turf-600); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:15px;
}
.mod-copy{min-width:0}
.mod-copy h4{
  margin:0 0 6px; font-family:"Big Shoulders Display", sans-serif; font-weight:700;
  text-transform:uppercase; letter-spacing:.01em; font-size:16px; color:var(--turf-600);
}
.mod-copy p{margin:0 0 10px; font-size:13.5px; color:var(--ink); line-height:1.55}
.mod-copy p:last-child{margin-bottom:0}
.mod-list{margin:0 0 10px; padding-left:18px; font-size:13.5px; color:var(--ink); line-height:1.6}
.mod-list li{margin-bottom:4px}
.mod-list:last-child{margin-bottom:0}
.mod-flow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0}
.mod-flow:last-child{margin-bottom:0}
.mod-chip{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; font-weight:700; font-size:13px; color:var(--ink); text-align:center;
}
.mod-chip small{font-weight:500; font-size:10.5px; color:var(--ink-muted)}
.mod-chip-result{background:var(--surface); border:1px solid var(--turf-600); color:var(--turf-600)}
.mod-chip-gold{background:var(--gold-soft); border-color:var(--gold); color:var(--gold-ink)}
.mod-chip-plata{background:var(--plata-soft); border-color:var(--plata); color:var(--plata-ink)}
.mod-chip-bronze{background:var(--coral-soft); border-color:var(--coral); color:var(--ink)}
.mod-arrow{font-size:20px; color:var(--ink-muted)}

/* ---------- cruce diagram (esquema de cruce de posiciones) ---------- */
.cross-diagram{width:100%; height:auto; margin:6px 0 4px; display:block}
.cross-diagram .cd-col-label{
  fill:var(--turf-600); font-family:"Big Shoulders Display", sans-serif; font-weight:700;
  font-size:14px; text-transform:uppercase; letter-spacing:.02em; text-anchor:middle;
}
.cross-diagram .cd-box{fill:var(--surface); stroke:var(--border); stroke-width:1.5}
.cross-diagram .cd-badge-bg{fill:var(--turf-600)}
.cross-diagram .cd-badge-text{
  fill:#fff; font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:15px;
  text-anchor:middle; dominant-baseline:central;
}
.cross-diagram .cd-line{stroke:var(--turf-600); stroke-width:2.5; opacity:.55}
.cross-diagram .cd-line-straight{stroke:var(--ink-muted); stroke-width:2.5; opacity:.55; stroke-dasharray:5 4}

/* variantes de color por copa, usadas en el cruce de 4 zonas (Sub 14) */
.cross-diagram .cd-badge-bg.cd-badge-oro{fill:var(--gold)}
.cross-diagram .cd-badge-text.cd-badge-text-oro{fill:var(--gold-ink)}
.cross-diagram .cd-badge-bg.cd-badge-plata{fill:var(--plata)}
.cross-diagram .cd-badge-text.cd-badge-text-plata{fill:#fff}
.cross-diagram .cd-badge-bg.cd-badge-estimulo{fill:var(--coral)}
.cross-diagram .cd-badge-text.cd-badge-text-estimulo{fill:#fff}
.cross-diagram .cd-line-oro{stroke:var(--gold); opacity:.7}
.cross-diagram .cd-line-plata{stroke:var(--plata); opacity:.7}
.cross-diagram .cd-line-estimulo{stroke:var(--coral); opacity:.7}

.cross-diagram-pair{display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 10px}
.cross-diagram-pair > div{flex:1; min-width:260px}
.mod-example-label{margin:14px 0 4px !important; font-size:12.5px !important; font-weight:600; color:var(--ink-muted) !important; font-style:italic}
.cd-legend{display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 14px; font-size:12px; color:var(--ink-muted)}
.cd-legend span{display:inline-flex; align-items:center; gap:6px}
.cd-legend i{width:12px; height:12px; border-radius:3px; display:inline-block}
.cd-legend i.cd-dot-oro{background:var(--gold)}
.cd-legend i.cd-dot-plata{background:var(--plata)}
.cd-legend i.cd-dot-estimulo{background:var(--coral)}

.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
.section-title{
  font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.03em; font-size:19px; color:var(--turf-600); margin:0;
}
.section-note{font-size:12.5px; color:var(--ink-muted)}

.zone-block{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 16px 18px; margin-bottom:16px;
}
.zone-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.zone-name{
  font-family:"Big Shoulders Display", sans-serif; font-size:17px; font-weight:700;
  text-transform:uppercase; letter-spacing:.02em; color:var(--turf-600); margin:0;
}
.zone-tag{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted)}

/* ---------- fixture by day ---------- */
.day-block{margin-bottom:22px}
.day-block:last-child{margin-bottom:0}
.day-title{
  font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.02em; font-size:15px; color:var(--ink-muted); margin:0 0 10px;
  padding-bottom:6px; border-bottom:1px solid var(--border);
}

/* ---------- match cards ---------- */
.match-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px}
.match-card{
  border:1px solid var(--border); border-radius:12px; background:var(--surface);
  padding:11px 12px 10px; position:relative;
}
.match-card.is-live{border-color:var(--coral)}
.match-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.match-card-head .match-status{margin-bottom:0}
.match-card-tags{display:inline-flex; align-items:center; gap:6px}
.match-zone-tag{
  font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--ink-muted); background:var(--surface-2);
  border-radius:999px; padding:3px 8px;
}
.match-num-tag{
  font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--turf-600); background:var(--coral-soft);
  border-radius:999px; padding:3px 8px;
}
.match-status{
  display:inline-flex; align-items:center; gap:5px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; padding:3px 8px; border-radius:999px; margin-bottom:8px;
}
.match-status.pendiente{background:var(--surface-2); color:var(--ink-muted)}
.match-status.vivo{background:var(--coral-soft); color:var(--coral)}
.match-status.vivo .live-dot{background:var(--coral)}
.match-status.final{background:var(--win-soft); color:var(--win)}
.match-teams{display:flex; flex-direction:column; gap:5px}
.match-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.match-team{font-size:14px; font-weight:600; color:var(--ink)}
.match-row.win .match-team{color:var(--turf-600)}
.match-score{
  font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:22px;
  min-width:1.4em; text-align:right; color:var(--ink);
}
.match-row.win .match-score{color:var(--turf-600)}
.match-meta{
  margin-top:8px; padding-top:7px; border-top:1px dashed var(--border);
  display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace;
  font-size:10.5px; color:var(--ink-muted);
}

/* ---------- standings table ---------- */
.standings-wrap{overflow-x:auto; margin-top:4px}
table.standings{border-collapse:collapse; width:100%; min-width:480px; font-size:13px}
table.standings th, table.standings td{padding:7px 8px; text-align:center; white-space:nowrap}
table.standings th{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-muted); border-bottom:1px solid var(--border); font-weight:600;
}
table.standings td.team{text-align:left; font-weight:600}
table.standings td.pts{font-weight:800; color:var(--turf-600)}
table.standings tbody tr{border-bottom:1px solid var(--border)}
table.standings tbody tr:last-child{border-bottom:none}
table.standings tbody tr.qualifies td.team{position:relative; padding-left:14px}
table.standings tbody tr.qualifies td.team::before{
  content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:2px; background:var(--gold);
}
.pos{font-family:"IBM Plex Mono",monospace; color:var(--ink-muted)}

/* ---------- bracket ---------- */
.bracket{display:flex; gap:22px; align-items:center; overflow-x:auto; padding:6px 2px 10px}
.bracket-col{display:flex; flex-direction:column; gap:16px; min-width:210px}
.bracket-col.final-col{justify-content:center}
.bracket-label{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-muted); margin-bottom:2px;
}
.bracket-slot{
  border:1px solid var(--border); border-radius:10px; background:var(--surface); padding:9px 10px;
  box-shadow:var(--shadow);
}
.bracket-slot .match-row{padding:2px 0}
.bracket-slot .match-team{font-size:13px}
.bracket-slot .match-score{font-size:18px}
.bracket-placeholder{
  border:1px dashed var(--border); border-radius:10px; padding:12px 10px; text-align:center;
  font-size:12px; color:var(--ink-muted); font-style:italic;
}
.third-place{margin-top:14px}
.third-place .bracket-slot{max-width:280px}

.bracket-round{margin-bottom:18px}
.bracket-round:last-child{margin-bottom:0}
.bracket-round-title{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-muted); margin:0 0 8px;
}
.cup-block{margin-bottom:26px}
.cup-block:last-child{margin-bottom:0}
.cup-title{
  font-family:"Big Shoulders Display", sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.02em; font-size:18px; color:var(--turf-600); margin:0 0 12px;
  padding-bottom:6px; border-bottom:2px solid var(--border);
}

/* ---------- floating action / admin ---------- */
.fab{
  position:fixed; right:18px; bottom:18px; z-index:40;
  background:var(--turf-600); color:#fff; border:none; border-radius:999px;
  padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer;
  box-shadow:0 10px 28px -8px rgba(18,52,35,.55); display:inline-flex; align-items:center; gap:8px;
}
.fab:hover{background:var(--turf-500)}
.admin-link{position:fixed; right:18px; bottom:18px; z-index:40; background:var(--surface); color:var(--ink-muted); border-color:var(--border)}
.admin-link:hover{background:var(--surface-2); color:var(--ink)}
.fab .plus{
  width:20px;height:20px;border-radius:50%;background:var(--gold); color:var(--gold-ink);
  display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; line-height:1;
}

.readonly-banner{
  max-width:1080px; margin:14px auto 0; padding:10px 20px; font-size:12.5px; color:var(--ink-muted);
  display:flex; align-items:center; gap:8px;
}
.readonly-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-muted)}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,20,14,.55); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
@media (min-width:720px){ .modal-overlay{align-items:center} }
.modal{
  background:var(--surface); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; box-shadow:var(--shadow); border:1px solid var(--border); border-bottom:none;
}
@media (min-width:720px){ .modal{border-radius:16px; border-bottom:1px solid var(--border)} }
.modal-head{
  position:sticky; top:0; background:var(--surface); z-index:2;
  display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px;
  border-bottom:1px solid var(--border);
}
.modal-title{font-family:"Big Shoulders Display",sans-serif; font-size:19px; font-weight:700; text-transform:uppercase; margin:0}
.modal-close{
  background:var(--surface-2); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;
  font-size:15px; color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.modal-tabs{display:flex; gap:6px; padding:10px 16px 0}
.modal-tab{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-muted);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.modal-tab[aria-selected="true"]{background:var(--turf-600); color:#fff; border-color:var(--turf-600)}
.modal-body{padding:14px 16px 22px}

.admin-match-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
}
.admin-match-row:last-child{border-bottom:none}
.admin-match-row:hover{background:var(--surface-2)}
.amr-teams{font-size:13.5px; font-weight:600}
.amr-teams .vs{color:var(--ink-muted); font-weight:400; margin:0 4px}
.amr-meta{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-muted); margin-top:2px}
.amr-status{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:999px; flex-shrink:0}
.amr-status.pendiente{background:var(--surface-2); color:var(--ink-muted)}
.amr-status.vivo{background:var(--coral-soft); color:var(--coral)}
.amr-status.final{background:var(--win-soft); color:var(--win)}

.score-form{padding:6px 2px}
.score-form h4{font-size:15px; margin:0 0 12px}
.score-teams{display:grid; grid-template-columns:1fr 70px; gap:10px; align-items:center; margin-bottom:10px}
.score-teams label{font-size:13.5px; font-weight:600}
.score-teams input[type=number]{
  width:100%; font-family:"Big Shoulders Display",sans-serif; font-size:24px; text-align:center;
  border:1px solid var(--border); border-radius:8px; padding:6px 4px; background:var(--surface); color:var(--ink);
}
.field-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.field-row > div{flex:1; min-width:110px}
.field-row label{display:block; font-size:11.5px; color:var(--ink-muted); margin-bottom:3px; font-family:"IBM Plex Mono",monospace}
.field-row input[type=text], .field-row input[type=time], .field-row select{
  width:100%; border:1px solid var(--border); border-radius:8px; padding:7px 8px; font-size:13.5px; background:var(--surface); color:var(--ink);
}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.btn{
  border-radius:9px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid transparent;
}
.btn-primary{background:var(--turf-600); color:#fff}
.btn-primary:hover{background:var(--turf-500)}
.btn-live{background:var(--coral); color:#fff}
.btn-live:hover{opacity:.9}
.btn-ghost{background:var(--surface-2); color:var(--ink); border-color:var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--loss-soft); color:var(--loss)}
.btn:disabled{opacity:.5; cursor:not-allowed}

.team-editor{margin-bottom:18px}
.team-editor h4{font-size:14px; margin:0 0 8px; color:var(--turf-600)}
.team-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px}
.team-list input{border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:13px; background:var(--surface); color:var(--ink)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60;
  background:var(--turf-700); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:8px;
}
.toast.error{background:var(--loss)}

.empty-note{font-size:13px; color:var(--ink-muted); font-style:italic; padding:8px 2px}

/* ---------- TV / pantalla grande mode ---------- */
body.tv-mode{font-size:calc(15px * var(--scale))}
body.tv-mode .fab, body.tv-mode .tabbar{display:none}
body.tv-mode .wrap{max-width:1400px}
body.tv-mode .brand-title{font-size:clamp(34px, 5vw, 56px)}
body.tv-mode .sponsor-logo{height:72px}
@media (max-width:480px){ .sponsor-logo{height:38px} }
body.tv-mode .section-title{font-size:24px}
body.tv-mode .zone-name{font-size:21px}
body.tv-mode .match-team{font-size:16px}
body.tv-mode .match-score{font-size:27px}
body.tv-mode table.standings{font-size:15px}

</style>

<body>
<div id="app"></div>
<script>
const CSS = "/* ===== Marcador en vivo — torneo de hockey ===== */\n\n:root{\n  --bg:#F7F4F3;\n  --surface:#FFFFFF;\n  --surface-2:#F1E7E6;\n  --border:#E3D2D0;\n  --ink:#241414;\n  --ink-muted:#6B5958;\n  --turf-700:#7A1418;\n  --turf-600:#EA2427;\n  --turf-500:#FF5449;\n  --gold:#D99A00;\n  --gold-soft:#F6E7BF;\n  --gold-ink:#5C4200;\n  --plata:#3E6FA8;\n  --plata-soft:#DCE9F6;\n  --plata-ink:#1F3A57;\n  --coral:#D9502A;\n  --coral-soft:#F7DCD1;\n  --win:#1F7A43;\n  --win-soft:#DFF0E4;\n  --draw:#8A7A22;\n  --draw-soft:#F1EBCF;\n  --loss:#B23A3A;\n  --loss-soft:#F6DEDE;\n  --shadow:0 1px 2px rgba(40,10,10,.07), 0 8px 24px -12px rgba(40,10,10,.2);\n  --radius:14px;\n  --scale:1;\n}\n\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#180E0D;\n    --surface:#211615;\n    --surface-2:#2A1A19;\n    --border:#3C2A28;\n    --ink:#F2E9E8;\n    --ink-muted:#B09B99;\n    --turf-700:#2A0A0A;\n    --turf-600:#FF5449;\n    --turf-500:#FF8478;\n    --gold:#EFB93B;\n    --gold-soft:#3A2E0E;\n    --gold-ink:#F6E2A6;\n    --plata:#7FA8E0;\n    --plata-soft:#1E2E40;\n    --plata-ink:#D7E6F5;\n    --coral:#FF7A52;\n    --coral-soft:#3A2016;\n    --win:#3FAE71;\n    --win-soft:#173425;\n    --draw:#CBB84E;\n    --draw-soft:#332C10;\n    --loss:#E56A6A;\n    --loss-soft:#3A1D1D;\n    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#180E0D;\n  --surface:#211615;\n  --surface-2:#2A1A19;\n  --border:#3C2A28;\n  --ink:#F2E9E8;\n  --ink-muted:#B09B99;\n  --turf-700:#2A0A0A;\n  --turf-600:#FF5449;\n  --turf-500:#FF8478;\n  --gold:#EFB93B;\n  --gold-soft:#3A2E0E;\n  --gold-ink:#F6E2A6;\n  --plata:#7FA8E0;\n  --plata-soft:#1E2E40;\n  --plata-ink:#D7E6F5;\n  --coral:#FF7A52;\n  --coral-soft:#3A2016;\n  --win:#3FAE71;\n  --win-soft:#173425;\n  --draw:#CBB84E;\n  --draw-soft:#332C10;\n  --loss:#E56A6A;\n  --loss-soft:#3A1D1D;\n  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);\n}\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--ink);\n  font-family:\"Source Sans 3\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  font-size:15px;\n  line-height:1.45;\n}\nh1,h2,h3{text-wrap:balance}\nimg{max-width:100%}\nbutton{font-family:inherit}\n.mono{font-family:\"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace}\n.tabular{font-variant-numeric:tabular-nums}\n:focus-visible{outline:2px solid var(--gold); outline-offset:2px}\n\n@media (prefers-reduced-motion: reduce){\n  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}\n}\n\n/* ---------- layout shell ---------- */\n.wrap{max-width:1080px; margin:0 auto; padding:0 20px 96px}\n\n/* ---------- header / scoreboard bar ---------- */\n.scorebar{\n  background:linear-gradient(180deg, var(--turf-700), var(--turf-600));\n  color:#F3F7EF;\n  border-bottom:3px solid var(--gold);\n  position:sticky; top:0; z-index:30;\n}\n.scorebar-inner{\n  max-width:1080px; margin:0 auto; padding:16px 20px 14px;\n  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px;\n}\n.brand-block{display:flex; align-items:center; gap:14px}\n.sponsor-logo{\n  height:50px; width:auto; border-radius:9px; display:block;\n  border:2px solid rgba(255,255,255,.85);\n  box-shadow:0 4px 12px -4px rgba(0,0,0,.5);\n}\n.brand-eyebrow{\n  font-family:\"IBM Plex Mono\", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;\n  color:var(--gold); margin:0 0 4px;\n}\n.brand-title{\n  font-family:\"Big Shoulders Display\", \"Archivo Black\", sans-serif;\n  font-weight:800; text-transform:uppercase; letter-spacing:.01em;\n  font-size:clamp(26px, 4vw, 40px); line-height:.98; margin:0;\n}\n.brand-sub{margin:6px 0 0; font-size:13.5px; color:#F0D8D5; max-width:52ch}\n.scorebar-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap}\n.updated-chip{\n  font-family:\"IBM Plex Mono\", monospace; font-size:11.5px; color:#F0D8D5;\n  border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 10px;\n}\n.live-chip{\n  display:inline-flex; align-items:center; gap:7px;\n  background:rgba(217,80,42,.18); border:1px solid var(--coral);\n  color:#FFDFD2; font-family:\"IBM Plex Mono\",monospace; font-size:12px; font-weight:600;\n  border-radius:999px; padding:5px 11px 5px 9px;\n}\n.live-dot{width:7px;height:7px;border-radius:50%;background:var(--coral); box-shadow:0 0 0 0 rgba(217,80,42,.6); animation:pulse 1.8s infinite}\n@keyframes pulse{\n  0%{box-shadow:0 0 0 0 rgba(217,80,42,.55)}\n  70%{box-shadow:0 0 0 8px rgba(217,80,42,0)}\n  100%{box-shadow:0 0 0 0 rgba(217,80,42,0)}\n}\n.tv-btn{\n  border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06); color:#F3F7EF;\n  border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;\n  display:inline-flex; align-items:center; gap:6px;\n}\n.tv-btn:hover{background:rgba(255,255,255,.14)}\n\n/* category tabs */\n.tabbar{max-width:1080px; margin:0 auto; padding:10px 20px 0; display:flex; gap:8px; flex-wrap:wrap}\n.tab{\n  border:1px solid rgba(255,255,255,.22); background:transparent; color:#F1DCDA;\n  padding:8px 14px; border-radius:999px 999px 0 0; font-size:13.5px; font-weight:600; cursor:pointer;\n  border-bottom:none;\n}\n.tab[aria-selected=\"true\"]{background:var(--bg); color:var(--turf-600); border-color:var(--bg)}\n.tab-info{margin-left:auto; border-style:dashed; opacity:.9}\n.tab-info[aria-selected=\"true\"]{opacity:1}\n\n/* ---------- section shell ---------- */\n.section{margin-top:28px}\n\n/* ---------- \"¿Cómo se juega?\" explainer ---------- */\n.mod-cat-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}\n.mod-cat-btn{\n  border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);\n  padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer;\n}\n.mod-cat-btn:hover{background:var(--surface-2)}\n.mod-cat-btn[aria-selected=\"true\"]{background:var(--turf-600); color:#fff; border-color:var(--turf-600)}\n.mod-card{\n  display:flex; gap:14px; align-items:flex-start;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);\n  box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;\n}\n.mod-step{\n  flex:none; width:30px; height:30px; border-radius:50%; background:var(--turf-600); color:#fff;\n  display:flex; align-items:center; justify-content:center;\n  font-family:\"Big Shoulders Display\", sans-serif; font-weight:800; font-size:15px;\n}\n.mod-copy{min-width:0}\n.mod-copy h4{\n  margin:0 0 6px; font-family:\"Big Shoulders Display\", sans-serif; font-weight:700;\n  text-transform:uppercase; letter-spacing:.01em; font-size:16px; color:var(--turf-600);\n}\n.mod-copy p{margin:0 0 10px; font-size:13.5px; color:var(--ink); line-height:1.55}\n.mod-copy p:last-child{margin-bottom:0}\n.mod-list{margin:0 0 10px; padding-left:18px; font-size:13.5px; color:var(--ink); line-height:1.6}\n.mod-list li{margin-bottom:4px}\n.mod-list:last-child{margin-bottom:0}\n.mod-flow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0}\n.mod-flow:last-child{margin-bottom:0}\n.mod-chip{\n  display:flex; flex-direction:column; align-items:center; gap:2px;\n  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;\n  padding:8px 12px; font-weight:700; font-size:13px; color:var(--ink); text-align:center;\n}\n.mod-chip small{font-weight:500; font-size:10.5px; color:var(--ink-muted)}\n.mod-chip-result{background:var(--surface); border:1px solid var(--turf-600); color:var(--turf-600)}\n.mod-chip-gold{background:var(--gold-soft); border-color:var(--gold); color:var(--gold-ink)}\n.mod-chip-plata{background:var(--plata-soft); border-color:var(--plata); color:var(--plata-ink)}\n.mod-chip-bronze{background:var(--coral-soft); border-color:var(--coral); color:var(--ink)}\n.mod-arrow{font-size:20px; color:var(--ink-muted)}\n\n/* ---------- cruce diagram (esquema de cruce de posiciones) ---------- */\n.cross-diagram{width:100%; height:auto; margin:6px 0 4px; display:block}\n.cross-diagram .cd-col-label{\n  fill:var(--turf-600); font-family:\"Big Shoulders Display\", sans-serif; font-weight:700;\n  font-size:14px; text-transform:uppercase; letter-spacing:.02em; text-anchor:middle;\n}\n.cross-diagram .cd-box{fill:var(--surface); stroke:var(--border); stroke-width:1.5}\n.cross-diagram .cd-badge-bg{fill:var(--turf-600)}\n.cross-diagram .cd-badge-text{\n  fill:#fff; font-family:\"Big Shoulders Display\", sans-serif; font-weight:800; font-size:15px;\n  text-anchor:middle; dominant-baseline:central;\n}\n.cross-diagram .cd-line{stroke:var(--turf-600); stroke-width:2.5; opacity:.55}\n.cross-diagram .cd-line-straight{stroke:var(--ink-muted); stroke-width:2.5; opacity:.55; stroke-dasharray:5 4}\n\n/* variantes de color por copa, usadas en el cruce de 4 zonas (Sub 14) */\n.cross-diagram .cd-badge-bg.cd-badge-oro{fill:var(--gold)}\n.cross-diagram .cd-badge-text.cd-badge-text-oro{fill:var(--gold-ink)}\n.cross-diagram .cd-badge-bg.cd-badge-plata{fill:var(--plata)}\n.cross-diagram .cd-badge-text.cd-badge-text-plata{fill:#fff}\n.cross-diagram .cd-badge-bg.cd-badge-estimulo{fill:var(--coral)}\n.cross-diagram .cd-badge-text.cd-badge-text-estimulo{fill:#fff}\n.cross-diagram .cd-line-oro{stroke:var(--gold); opacity:.7}\n.cross-diagram .cd-line-plata{stroke:var(--plata); opacity:.7}\n.cross-diagram .cd-line-estimulo{stroke:var(--coral); opacity:.7}\n\n.cross-diagram-pair{display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 10px}\n.cross-diagram-pair > div{flex:1; min-width:260px}\n.mod-example-label{margin:14px 0 4px !important; font-size:12.5px !important; font-weight:600; color:var(--ink-muted) !important; font-style:italic}\n.cd-legend{display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 14px; font-size:12px; color:var(--ink-muted)}\n.cd-legend span{display:inline-flex; align-items:center; gap:6px}\n.cd-legend i{width:12px; height:12px; border-radius:3px; display:inline-block}\n.cd-legend i.cd-dot-oro{background:var(--gold)}\n.cd-legend i.cd-dot-plata{background:var(--plata)}\n.cd-legend i.cd-dot-estimulo{background:var(--coral)}\n\n.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}\n.section-title{\n  font-family:\"Big Shoulders Display\", sans-serif; font-weight:700; text-transform:uppercase;\n  letter-spacing:.03em; font-size:19px; color:var(--turf-600); margin:0;\n}\n.section-note{font-size:12.5px; color:var(--ink-muted)}\n\n.zone-block{\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);\n  box-shadow:var(--shadow); padding:16px 16px 18px; margin-bottom:16px;\n}\n.zone-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}\n.zone-name{\n  font-family:\"Big Shoulders Display\", sans-serif; font-size:17px; font-weight:700;\n  text-transform:uppercase; letter-spacing:.02em; color:var(--turf-600); margin:0;\n}\n.zone-tag{font-family:\"IBM Plex Mono\",monospace; font-size:11px; color:var(--ink-muted)}\n\n/* ---------- fixture by day ---------- */\n.day-block{margin-bottom:22px}\n.day-block:last-child{margin-bottom:0}\n.day-title{\n  font-family:\"Big Shoulders Display\", sans-serif; font-weight:700; text-transform:uppercase;\n  letter-spacing:.02em; font-size:15px; color:var(--ink-muted); margin:0 0 10px;\n  padding-bottom:6px; border-bottom:1px solid var(--border);\n}\n\n/* ---------- match cards ---------- */\n.match-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px}\n.match-card{\n  border:1px solid var(--border); border-radius:12px; background:var(--surface);\n  padding:11px 12px 10px; position:relative;\n}\n.match-card.is-live{border-color:var(--coral)}\n.match-card-head{d   function syncPlayoffTeams(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return;
    specs.forEach(function(spec){
      var teamA = resolveSource(cat, spec.A.src);
      var teamB = resolveSource(cat, spec.B.src);
      var m = cat.matches.find(function(x){ return x.key===spec.key; });
      if(!m){
        cat.matches.push(makeMatch({
          stage:'bracket', key:spec.key, groupKey:spec.group, roundLabel:spec.round,
          posWin: spec.posWin || null, posLose: spec.posLose || null,
          slotLabelA: spec.A.label, slotLabelB: spec.B.label,
          teamA: teamA, teamB: teamB
        }));
        return;
      }
      m.slotLabelA = spec.A.label; m.slotLabelB = spec.B.label;
      m.groupKey = spec.group; m.roundLabel = spec.round;
      m.posWin = spec.posWin || null; m.posLose = spec.posLose || null;
      var changed = (teamA!==m.teamA) || (teamB!==m.teamB);
      if(changed && m.status!=='pendiente'){
        m.status = 'pendiente'; m.scoreA = null; m.scoreB = null; m.shootoutWinner = null;
      }
      m.teamA = teamA; m.teamB = teamB;
    });
  }

  function computeEstimuloStandings(cat){
    var teams;
    if(cat.format==='copas4zonas'){
      // Los equipos de la Copa Estímulo son el 5° de cada una de las 4 zonas.
      if(!cat.zones.every(function(z){ return zoneComplete(cat, z.id); })) return null;
      teams = cat.zones.map(function(z){
        var st = computeStandings(cat, z);
        var row = st[4];
        return row ? row.team : null;
      });
      if(teams.some(function(t){ return !t; })) return null;
    } else {
      var pool = computeTier(cat, 4);
      if(!pool || pool.length<5) return null;
      teams = [pool[1].team, pool[2].team, pool[3].team, pool[4].team];
    }
    var matches = cat.matches.filter(function(m){ return m.groupKey==='estimulo'; });
    return computeStandingsGeneric(matches, teams, cat.pointsWin, cat.pointsDraw, cat.pointsLoss);
  }

  function computeFinalStandings(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return null;
    var result = [];
    specs.forEach(function(spec){
      if(spec.posWin==null) return;
      var m = cat.matches.find(function(x){ return x.key===spec.key; });
      var w = m ? winnerOf(m) : null;
      var winnerTeam = w ? (w==='A'?m.teamA:m.teamB) : null;
      var loserTeam = w ? (w==='A'?m.teamB:m.teamA) : null;
      result.push({pos:spec.posWin, team:winnerTeam});
      result.push({pos:spec.posLose, team:loserTeam});
    });
    if(cat.format==='copas5zonas' || cat.format==='copas4zonas'){
      var est = computeEstimuloStandings(cat);
      for(var p=17;p<=20;p++){
        result.push({pos:p, team: est ? (est[p-17] && est[p-17].team) : null});
      }
    }
    result.sort(function(a,b){ return a.pos-b.pos; });
    return result;
  }

  function ensureCrossings(cat){
    if(cat.zones.length !== 2) return;
    var zA = cat.zones[0], zB = cat.zones[1];
    var groupsOk = zoneComplete(cat, zA.id) && zoneComplete(cat, zB.id);
    var hasSemis = cat.matches.some(function(m){ return m.stage==='semifinal'; });
    if(groupsOk && !hasSemis){
      var stA = computeStandings(cat, zA), stB = computeStandings(cat, zB);
      if(stA.length>=2 && stB.length>=2){
        var sf1 = makeMatch({stage:'semifinal', slotLabelA:'1° ' + zA.name, slotLabelB:'2° ' + zB.name, teamA:stA[0].team, teamB:stB[1].team});
        var sf2 = makeMatch({stage:'semifinal', slotLabelA:'1° ' + zB.name, slotLabelB:'2° ' + zA.name, teamA:stB[0].team, teamB:stA[1].team});
        cat.matches.push(sf1, sf2);
      }
    }
    var semis = cat.matches.filter(function(m){ return m.stage==='semifinal'; });
    var bothResolved = semis.length===2 && semis.every(function(m){ return winnerOf(m)!==null; });
    var hasFinal = cat.matches.some(function(m){ return m.stage==='final'; });
    if(bothResolved && !hasFinal){
      var w = semis.map(winnerName), l = semis.map(loserName);
      cat.matches.push(makeMatch({stage:'final', slotLabelA:'Ganador SF1', slotLabelB:'Ganador SF2', teamA:w[0], teamB:w[1]}));
      cat.matches.push(makeMatch({stage:'tercer', slotLabelA:'Perdedor SF1', slotLabelB:'Perdedor SF2', teamA:l[0], teamB:l[1]}));
    }
  }

  function refreshCategory(cat){
    if(cat.format==='cruce2zonas' || cat.format==='copas5zonas' || cat.format==='copas4zonas'){
      syncPlayoffTeams(cat);
      return;
    }
    refreshSimpleCategory(cat);
  }

  function refreshSimpleCategory(cat){
    var semis = cat.matches.filter(function(m){ return m.stage==='semifinal'; });
    if(semis.length && !semis.every(function(m){ return winnerOf(m)!==null; })){
      cat.matches = cat.matches.filter(function(m){ return m.stage!=='final' && m.stage!=='tercer'; });
    }
    var zonesOk = cat.zones.length===2 && cat.zones.every(function(z){ return zoneComplete(cat, z.id); });
    if(!zonesOk && semis.length){
      cat.matches = cat.matches.filter(function(m){ return m.stage==='grupos'; });
    }
    ensureCrossings(cat);
  }

  function buildFullHtml(newState){
    var scriptBody = 'const CSS = ' + JSON.stringify(CSS) + ';\n' +
      'const HEAD_META = ' + JSON.stringify(HEAD_META) + ';\n' +
      '(' + APP.toString() + ')(' + JSON.stringify(newState) + ');\n';
    var safeScript = scriptBody.split('<\/script').join('<\\/script');
    return '<!doctype html>\n<html lang="es">\n<head>\n' + HEAD_META + '\n<style>\n' + CSS + '\n</style>\n</head>\n<body>\n<div id="app"></div>\n<script>\n' + safeScript + '<\/script>\n</body>\n</html>\n';
  }

  function persist(successMsg){
    STATE.updatedAt = new Date().toISOString();
    render();
    if(isReadOnly){ showToast('Este enlace es de solo lectura: los resultados los carga la organización del torneo.', true); return; }
    ensureCapability().then(function(ns){
      if(!ns){ showToast('Vista previa: los cambios no se están publicando desde acá.'); return; }
      return ns.publish(buildFullHtml(STATE)).then(function(){
        showToast(successMsg || 'Guardado y publicado.');
      });
    }).catch(function(err){
      if(err && (err.code==='not_writer' || err.code==='not_granted')){
        isReadOnly = true;
        render();
        showToast('Este enlace es de solo lectura: los resultados los carga la organización del torneo.', true);
      } else if(err && err.code==='conflict'){
        // otra publicación ganó; la vista se recarga sola
      } else {
        showToast('No se pudo publicar. Probá de nuevo en unos segundos.', true);
      }
    });
  }

  function mcpErrorMessage(err){
    var code = err && err.code;
    if(code==='needs_reauth') return 'Reconectá Google Drive en Configuración de Claude → Conectores.';
    if(code==='server_not_connected') return 'No encontramos Google Drive conectado a tu cuenta de Claude.';
    if(code==='selection_required') return 'Tenés más de una cuenta de Google conectada — elegí una desde el aviso de Claude.';
    if(code==='blocked_by_policy') return 'Tu organización bloqueó el acceso a Google Drive desde esta página.';
    if(code==='not_in_manifest') return 'Esta página no tiene autorización para leer esta planilla.';
    if(code==='not_granted' || code==='capability_disabled') return 'La sincronización con Google no está disponible en esta vista.';
    return 'No se pudo sincronizar. Probá de nuevo en unos segundos.';

  function decodeBase64Utf8(b64){
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function parseCsv(text){
    var rows = [], field = '', row = [], inQuotes = false, i = 0, n = text.length;
    while(i<n){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field = ''; i++; continue; }
        if(c === '\r'){ i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); field=''; row=[]; i++; continue; }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    if(!rows.length) return [];
    var headers = rows[0].map(function(h){ return h.trim(); });
    return rows.slice(1).filter(function(r){ return r.some(function(v){ return v && v.trim(); }); }).map(function(r){
      var obj = {};
      headers.forEach(function(h, idx){ obj[h] = r[idx]!=null ? r[idx] : ''; });
      return obj;
    });
  }

  function stripAccents(s){
    try{ return s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }catch(e){ return s; }
  }

  function normalizeStatus(estado, gaRaw, gbRaw){
    var s = stripAccents((estado||'').trim().toLowerCase());
    if(/final|termin|cerrad/.test(s)) return 'final';
    if(/vivo|jugando|curso/.test(s)) return 'vivo';
    if(/pendient|jugarse/.test(s)) return 'pendiente';
    if(gaRaw!=='' && gbRaw!=='') return 'final';
    if(gaRaw!=='' || gbRaw!=='') return 'vivo';
    return 'pendiente';
  }

  function applySheetRows(rows){
    var changed = false;
    rows.forEach(function(r){
      var catName = (r['Categoria']||r['Categoría']||'').trim();
      var zoneName = (r['Zona']||'').trim();
      var teamA = (r['EquipoA']||'').trim();
      var teamB = (r['EquipoB']||'').trim();
      if(!catName || !teamA || !teamB) return;
      var cat = STATE.categories.find(function(c){ return c.name.trim().toLowerCase()===catName.toLowerCase(); });
      if(!cat) return;
      var zone = cat.zones.find(function(z){ return z.name.trim().toLowerCase()===zoneName.toLowerCase(); });
      var m = cat.matches.find(function(x){
        if(x.stage!=='grupos') return false;
        if(zone && x.zoneId!==zone.id) return false;
        return (x.teamA===teamA && x.teamB===teamB) || (x.teamA===teamB && x.teamB===teamA);
      });
      if(!m) return;
      var gaRaw = (r['GolesA']==null ? '' : String(r['GolesA']).trim());
      var gbRaw = (r['GolesB']==null ? '' : String(r['GolesB']).trim());
      var status = normalizeStatus(r['Estado'], gaRaw, gbRaw);
      var gaNum = gaRaw==='' ? null : parseInt(gaRaw, 10);
      var gbNum = gbRaw==='' ? null : parseInt(gbRaw, 10);
      if(gaRaw!=='' && isNaN(gaNum)) return;
      if(gbRaw!=='' && isNaN(gbNum)) return;
      var newScoreA = m.teamA===teamA ? gaNum : gbNum;
      var newScoreB = m.teamA===teamA ? gbNum : gaNum;
      if(newScoreA==null && newScoreB==null) status = 'pendiente';
      if(m.scoreA!==newScoreA || m.scoreB!==newScoreB || m.status!==status){
        m.scoreA = newScoreA; m.scoreB = newScoreB; m.status = status;
        if(status!=='final') m.shootoutWinner = null;
        changed = true;
      }
    });
    return changed;
  }

  function extractSheetPayload(res){
    var payload = res && (res.payload!=null ? res.payload : res);
    if(typeof payload === 'string'){ try{ payload = JSON.parse(payload); }catch(e){} }
    return payload;
  }

  function ingestSheetResult(res){
    var payload = extractSheetPayload(res);
    if(!payload || !payload.content) return false;
    var text = decodeBase64Utf8(payload.content);
    var rows = parseCsv(text);
    var changed = applySheetRows(rows);
    STATE.categories.forEach(function(c){ refreshCategory(c); });
    return changed;
  }

  function syncNow(){
    if(!STATE.sheet || !STATE.sheet.fileId){ return; }
    sheetStatus = { state:'syncing', message:'Sincronizando…', lastSync: sheetStatus.lastSync };
    render();
    ensureMcp().then(function(mcp){
      if(!mcp){ throw {code:'capability_disabled'}; }
      return mcp.callTool('Google Drive', 'download_file_content', {fileId: STATE.sheet.fileId, exportMimeType:'text/csv'}, {cache:false});
    }).then(function(res){
      var changed = ingestSheetResult(res);
      sheetStatus = { state:'ok', message: changed ? 'Sincronizado: se cargaron cambios.' : 'Sincronizado — sin cambios nuevos.', lastSync: new Date().toISOString() };
      if(changed) persist('Resultados sincronizados desde Google Sheets.'); else render();
    }).catch(function(err){
      sheetStatus = { state:'error', message: mcpErrorMessage(err), lastSync: sheetStatus.lastSync };
      render();
    });
  }

  function startSheetWatch(){
    if(sheetWatchUnsub || !STATE.sheet || !STATE.sheet.fileId) return;
    ensureMcp().then(function(mcp){
      if(!mcp){ sheetStatus = {state:'error', message:'La sincronización automática no está disponible en esta vista.', lastSync:sheetStatus.lastSync}; render(); return; }
      sheetWatchUnsub = mcp.watchTool('Google Drive', 'download_file_content', {fileId: STATE.sheet.fileId, exportMimeType:'text/csv'}, function(ev){
        if(ev.type==='error'){ sheetStatus = {state:'error', message: mcpErrorMessage(ev.error), lastSync: sheetStatus.lastSync}; render(); return; }
        var changed = ingestSheetResult(ev.result);
        sheetStatus = { state:'ok', message:'Sincronización automática activa.', lastSync:new Date().toISOString() };
        if(changed) persist('Resultados actualizados desde Google Sheets.'); else render();
      }, {refetchInterval: 30000});
      sheetStatus = { state:'ok', message:'Sincronización automática activa.', lastSync:sheetStatus.lastSync };
      render();
    });
  }

  function stopSheetWatch(){
    if(sheetWatchUnsub){ sheetWatchUnsub(); sheetWatchUnsub = null; }
  }

  function toggleAutoSync(on){
    STATE.sheet = STATE.sheet || {};
    STATE.sheet.autoSync = on;
    if(on){ startSheetWatch(); }
    else { stopSheetWatch(); sheetStatus = {state:'idle', message:'Sincronización automática desactivada.', lastSync:sheetStatus.lastSync}; }
    persist(on ? 'Sincronización automática activada.' : 'Sincronización automática desactivada.');
  }

  function showToast(msg, isError){
    var old = document.getElementById('appToast');
    if(old) old.remove();
    var t = document.createElement('div');
    t.id = 'appToast';
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.remove(); }, 3600);
  }

  /* ---------------- rendering ---------------- */
  function statusLabel(st){ return st==='pendiente' ? 'A jugarse' : (st==='vivo' ? 'En vivo' : 'Final'); }

  function renderMatchCard(m, zoneTag){
    var refNum = m.matchNum != null ? m.matchNum : m.key;
    var winner = winnerOf(m);
    var rowAClass = 'match-row' + (winner==='A' ? ' win' : '');
    var rowBClass = 'match-row' + (winner==='B' ? ' win' : '');
    var scoreA = m.scoreA==null ? '–' : m.scoreA;
    var scoreB = m.scoreB==null ? '–' : m.scoreB;
    var statusHtml = m.status==='vivo'
      ? '<span class="live-dot"></span> En vivo'
      : statusLabel(m.status);
    return '' +
      '<div class="match-card' + (m.status==='vivo' ? ' is-live' : '') + '">' +
        '<div class="match-card-head">' +
          '<div class="match-status ' + m.status + '">' + statusHtml + '</div>' +
          '<span class="match-card-tags">' +
            (refNum ? '<span class="match-num-tag">Partido ' + esc(refNum) + '</span>' : '') +
            (zoneTag ? '<span class="match-zone-tag">' + esc(zoneTag) + '</span>' : '') +
          '</span>' +
        '</div>' +
        '<div class="match-teams">' +
          '<div class="' + rowAClass + '"><span class="match-team">' + esc(m.teamA || m.slotLabelA || 'A definir') + '</span><span class="match-score tabular">' + scoreA + '</span></div>' +
          '<div class="' + rowBClass + '"><span class="match-team">' + esc(m.teamB || m.slotLabelB || 'A definir') + '</span><span class="match-score tabular">' + scoreB + '</span></div>' +
        '</div>' +
        (m.court || m.time ? '<div class="match-meta"><span>' + esc(m.court||'') + '</span><span>' + esc(m.time||'') + '</span></div>' : '') +
      '</div>';
  }

  function renderStandings(cat, zone){
    var st = computeStandings(cat, zone);
    var rows = st.map(function(row, i){
      return '<tr class="' + (i<2 ? 'qualifies' : '') + '">' +
        '<td class="pos">' + (i+1) + '</td>' +
        '<td class="team">' + esc(row.team) + '</td>' +
        '<td class="tabular">' + row.pj + '</td>' +
        '<td class="tabular">' + row.pg + '</td>' +
        '<td class="tabular">' + row.pe + '</td>' +
        '<td class="tabular">' + row.pp + '</td>' +
        '<td class="tabular">' + row.gf + '</td>' +
        '<td class="tabular">' + row.gc + '</td>' +
        '<td class="tabular">' + (row.dg>0?'+':'') + row.dg + '</td>' +
        '<td class="tabular pts">' + row.pts + '</td>' +
      '</tr>';
    }).join('');
    return '<div class="standings-wrap"><table class="standings">' +
      '<thead><tr><th>#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function renderStandingsBlock(cat, zone){
    var complete = zoneComplete(cat, zone.id);
    return '<div class="zone-block">' +
      '<div class="zone-head"><h3 class="zone-name">' + esc(zone.name) + '</h3><span class="zone-tag">' + (complete ? 'Fase de grupos cerrada' : 'Fase de grupos en curso') + '</span></div>' +
      (zone.teams.length ? renderStandings(cat, zone) : '<p class="empty-note">Todavía no hay equipos cargados para esta zona.</p>') +
    '</div>';
  }

  function renderStandingsSection(cat){
    return cat.zones.map(function(z){ return renderStandingsBlock(cat, z); }).join('');
  }

  function renderFixtureSection(cat){
    var matches = cat.matches.filter(function(m){ return m.stage==='grupos'; });
    if(!matches.length) return '<p class="empty-note">Todavía no hay partidos cargados.</p>';
    var zoneName = {};
    cat.zones.forEach(function(z){ zoneName[z.id] = z.name; });
    var byDay = {};
    matches.forEach(function(m){
      var d = m.day || '';
      (byDay[d] = byDay[d] || []).push(m);
    });
    var days = Object.keys(byDay).sort(function(a,b){ return dayIndex(a) - dayIndex(b); });
    return days.map(function(d){
      var list = byDay[d].slice().sort(function(x,y){ return (x.time||'').localeCompare(y.time||''); });
      return '<div class="day-block">' +
        '<h3 class="day-title">' + esc(dayLabel(d)) + '</h3>' +
        '<div class="match-grid">' + list.map(function(m){ return renderMatchCard(m, zoneName[m.zoneId]); }).join('') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderBracketMatch(m, fallbackLabelA, fallbackLabelB){
    if(!m){
      return '<div class="bracket-slot">' +
        '<div class="match-row"><span class="match-team">' + esc(fallbackLabelA) + '</span></div>' +
        '<div class="match-row"><span class="match-team">' + esc(fallbackLabelB) + '</span></div>' +
      '</div>';
    }
    var winner = winnerOf(m);
    var scoreA = m.scoreA==null ? '' : m.scoreA;
    var scoreB = m.scoreB==null ? '' : m.scoreB;
    var statusHtml = m.status==='vivo' ? '<span class="live-dot"></span> En vivo' : statusLabel(m.status);
    var metaBits = [];
    if(m.day) metaBits.push(dayLabel(m.day));
    if(m.time) metaBits.push(m.time);
    if(m.court) metaBits.push(m.court);
    return '<div class="bracket-slot">' +
      (m.status!=='pendiente' ? '<div class="match-status ' + m.status + '">' + statusHtml + '</div>' : '') +
      '<div class="match-row' + (winner==='A'?' win':'') + '"><span class="match-team">' + esc(m.teamA || m.slotLabelA || 'A definir') + '</span><span class="match-score tabular">' + scoreA + '</span></div>' +
      '<div class="match-row' + (winner==='B'?' win':'') + '"><span class="match-team">' + esc(m.teamB || m.slotLabelB || 'A definir') + '</span><span class="match-score tabular">' + scoreB + '</span></div>' +
      (metaBits.length ? '<div class="match-meta"><span>' + esc(metaBits.join(' · ')) + '</span></div>' : '') +
    '</div>';
  }

  function renderBracketMatchByKey(cat, key){
    var m = cat.matches.find(function(x){ return x.key===key; });
    if(!m) return renderBracketMatch(null, 'A definir', 'A definir');
    return renderBracketMatch(m, m.slotLabelA||'A definir', m.slotLabelB||'A definir');
  }

  function renderStandingsGenericTable(rows, startPos){
    var body = rows.map(function(row, i){
      return '<tr>' +
        '<td class="pos">' + (startPos+i) + '°</td>' +
        '<td class="team">' + esc(row.team) + '</td>' +
        '<td class="tabular">' + row.pj + '</td>' +
        '<td class="tabular">' + row.pg + '</td>' +
        '<td class="tabular">' + row.pe + '</td>' +
        '<td class="tabular">' + row.pp + '</td>' +
        '<td class="tabular">' + row.gf + '</td>' +
        '<td class="tabular">' + row.gc + '</td>' +
        '<td class="tabular">' + (row.dg>0?'+':'') + row.dg + '</td>' +
        '<td class="tabular pts">' + row.pts + '</td>' +
      '</tr>';
    }).join('');
    return '<div class="standings-wrap"><table class="standings">' +
      '<thead><tr><th>#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div>';
  }

  function renderFinalStandingsTable(cat){
    var rows = computeFinalStandings(cat);
    if(!rows || !rows.some(function(r){ return r.team; })) return '';
    var body = rows.map(function(r){
      return '<tr><td class="pos">' + r.pos + '°</td><td class="team">' + esc(r.team||'A definir') + '</td></tr>';
    }).join('');
    return '<div class="zone-block"><div class="zone-head"><h3 class="zone-name">Posiciones finales</h3></div>' +
      '<div class="standings-wrap"><table class="standings"><thead><tr><th>#</th><th style="text-align:left">Equipo</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  function renderBracketRoundGroup(cat, specs, roundName){
    var list = specs.filter(function(s){ return s.round===roundName; });
    if(!list.length) return '';
    return '<div class="bracket-round"><h4 class="bracket-round-title">' + esc(roundName) + '</h4><div class="bracket">' +
      list.map(function(s){
        var tag = s.posWin ? (' · ' + s.posWin + '°/' + s.posLose + '°') : '';
        return '<div class="bracket-col"><div><div class="bracket-label">Partido ' + esc(s.key) + esc(tag) + '</div>' +
          renderBracketMatchByKey(cat, s.key) + '</div></div>';
      }).join('') +
    '</div></div>';
  }

  function renderCascadeBracket(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return '<p class="empty-note">Formato de llave no configurado para esta categoría.</p>';
    var html = renderBracketRoundGroup(cat, specs, 'Cruce') + renderBracketRoundGroup(cat, specs, 'Definición');
    html += renderFinalStandingsTable(cat);
    return html;
  }

  function renderCopasBracket(cat){
    var specs = buildBracketSpecs(cat);
    if(!specs) return '<p class="empty-note">Formato de llave no configurado para esta categoría.</p>';
    var cupOrder = [['oro','Copa Oro'], ['plata','Copa Plata'], ['estimulo','Copa Estímulo']];
    var roundOrder = ['Cuartos','Semifinal','Semifinal (5°-8°)','Semifinal (13°-16°)','Final','3° puesto','5° puesto','7° puesto'];
    var html = '';
    cupOrder.forEach(function(pair){
      var groupKey = pair[0], groupName = pair[1];
      var groupSpecs = specs.filter(function(s){ return s.group===groupKey; });
      if(!groupSpecs.length) return;
      html += '<div class="cup-block"><h3 class="cup-title">' + esc(groupName) + '</h3>';
      if(groupKey==='estimulo'){
        html += '<div class="bracket">' + groupSpecs.map(function(s){
          return '<div class="bracket-col"><div><div class="bracket-label">Partido ' + esc(s.key) + '</div>' +
            renderBracketMatchByKey(cat, s.key) + '</div></div>';
        }).join('') + '</div>';
        var est = computeEstimuloStandings(cat);
        html += est ? renderStandingsGenericTable(est, 17) : '<p class="empty-note">La tabla de la Copa Estímulo se arma cuando terminan de jugarse las 5 zonas.</p>';
      } else {
        roundOrder.forEach(function(rn){ html += renderBracketRoundGroup(cat, groupSpecs, rn); });
      }
      html += '</div>';
    });
    html += renderFinalStandingsTable(cat);
    return html;
  }

  var BRACKET_GROUP_DISPLAY_NAMES = {llave:'Cruce', oro:'Copa Oro', plata:'Copa Plata', estimulo:'Copa Estímulo'};

  // Cruces/copas ordenados por día y horario (no agrupados por copa/ronda) —
  // misma presentación que el fixture de la fase de grupos, con una etiqueta
  // de a qué copa/cruce pertenece cada partido.
  function renderBracketFixtureSection(cat){
    var matches = cat.matches.filter(function(m){ return m.stage==='bracket'; });
    if(!matches.length) return '<p class="empty-note">Todavía no hay partidos cargados.</p>';
    var byDay = {};
    matches.forEach(function(m){
      var d = m.day || '';
      (byDay[d] = byDay[d] || []).push(m);
    });
    var days = Object.keys(byDay).sort(function(a,b){ return dayIndex(a) - dayIndex(b); });
    var html = days.map(function(d){
      var list = byDay[d].slice().sort(function(x,y){
        var t = (x.time||'').localeCompare(y.time||'');
        if(t!==0) return t;
        return (Number(x.key)||0) - (Number(y.key)||0);
      });
      return '<div class="day-block">' +
        '<h3 class="day-title">' + esc(dayLabel(d)) + '</h3>' +
        '<div class="match-grid">' + list.map(function(m){
          var tag = BRACKET_GROUP_DISPLAY_NAMES[m.groupKey] || '';
          return renderMatchCard(m, tag);
        }).join('') + '</div>' +
      '</div>';
    }).join('');
    if(cat.format==='copas5zonas' || cat.format==='copas4zonas'){
      var est = computeEstimuloStandings(cat);
      html += '<div class="zone-block"><div class="zone-head"><h3 class="zone-name">Copa Estímulo</h3><span class="zone-tag">Posiciones 17° a 20°</span></div>' +
        (est ? renderStandingsGenericTable(est, 17) : '<p class="empty-note">La tabla de la Copa Estímulo se arma cuando terminan de jugarse las 5 zonas.</p>') +
      '</div>';
    }
    html += renderFinalStandingsTable(cat);
    return html;
  }

  function renderCrossings(cat){
    if(cat.format==='cruce2zonas' || cat.format==='copas5zonas' || cat.format==='copas4zonas') return renderBracketFixtureSection(cat);
    return renderSimpleCrossings(cat);
  }

  function renderSimpleCrossings(cat){
    if(cat.zones.length !== 2){
      return '<p class="empty-note">Los cruces automáticos están disponibles para categorías con 2 zonas.</p>';
    }
    var semis = cat.matches.filter(function(m){ return m.stage==='semifinal'; });
    var final = cat.matches.find(function(m){ return m.stage==='final'; });
    var tercer = cat.matches.find(function(m){ return m.stage==='tercer'; });
    if(!semis.length){
      return '<div class="bracket-placeholder" style="max-width:420px">Se arman solos apenas terminan de jugarse las dos zonas.</div>';
    }
    var html = '<div class="bracket">' +
      '<div class="bracket-col">' +
        '<div><div class="bracket-label">Semifinal 1</div>' + renderBracketMatch(semis[0]) + '</div>' +
        '<div><div class="bracket-label">Semifinal 2</div>' + renderBracketMatch(semis[1]) + '</div>' +
      '</div>' +
      '<div class="bracket-col final-col">' +
        '<div><div class="bracket-label">Final</div>' + renderBracketMatch(final, 'Ganador SF1', 'Ganador SF2') + '</div>' +
      '</div>' +
    '</div>';
    html += '<div class="third-place"><div class="bracket-label">Tercer puesto</div>' + renderBracketMatch(tercer, 'Perdedor SF1', 'Perdedor SF2') + '</div>';
    return html;
  }

  function renderReadonlyBanner(){
    if(!isReadOnly) return '';
    return '<div class="readonly-banner"><span class="dot"></span> Estás viendo la versión pública. Los resultados los carga la organización del torneo.</div>';
  }

  function renderScorebar(){
    var liveCount = 0;
    STATE.categories.forEach(function(c){ c.matches.forEach(function(m){ if(m.status==='vivo') liveCount++; }); });
    return '<div class="scorebar"><div class="scorebar-inner">' +
      '<div class="brand-block">' +
        (STATE.sponsorLogo ? '<img class="sponsor-logo" src="' + STATE.sponsorLogo + '" alt="Organiza">' : '') +
        '<div>' +
          '<p class="brand-eyebrow">Marcador en vivo</p>' +
          '<h1 class="brand-title">' + esc(STATE.tournamentName) + '</h1>' +
          (STATE.subtitle ? '<p class="brand-sub">' + esc(STATE.subtitle) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<div class="scorebar-meta">' +
        (liveCount>0 ? '<span class="live-chip"><span class="live-dot"></span>' + liveCount + ' en vivo</span>' : '') +
        '<span class="updated-chip">Actualizado ' + fmtUpdated(STATE.updatedAt) + '</span>' +
        '<button class="tv-btn" data-action="toggle-tv" type="button">' + (document.body.classList.contains('tv-mode') ? 'Salir de modo pantalla' : 'Modo pantalla') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="tabbar">' + STATE.categories.map(function(c){
      return '<button class="tab" role="tab" aria-selected="' + (c.id===STATE.activeCategoryId && ui.view==='torneo') + '" data-action="switch-category" data-id="' + c.id + '" type="button">' + esc(c.name) + '</button>';
    }).join('') +
    '<button class="tab tab-info" role="tab" aria-selected="' + (ui.view==='modalidad') + '" data-action="show-modalidad" type="button">¿Cómo se juega?</button>' +
    '</div></div>';
  }

  function renderMain(){
    if(ui.view==='modalidad'){
      var mcat = getCategory(ui.modalidadCategoryId) || getCategory(STATE.activeCategoryId);
      if(!mcat) return '<div class="wrap"></div>';
      return '<div class="wrap">' + renderModalidad(mcat) + '</div>';
    }
    var cat = getCategory(STATE.activeCategoryId);
    if(!cat) return '<div class="wrap"></div>';
    var isCopas = cat.format==='copas5zonas' || cat.format==='copas4zonas';
    var groupNote = cat.format==='cruce2zonas'
      ? 'Todos contra todos dentro de cada zona · después se cruzan para definir el 1° al 10°'
      : (isCopas
        ? 'Todos contra todos dentro de cada zona · después se arman la Copa Oro, Plata y Estímulo'
        : 'Se clasifican los dos primeros de cada zona');
    var crossTitle = cat.format==='cruce2zonas' ? 'Cruce de posiciones' : (isCopas ? 'Copas' : 'Cruces');
    var crossNote = cat.format==='cruce2zonas' ? 'Define el orden del 1° al 10° · ordenado por día y horario' : (isCopas ? 'Copa Oro, Copa Plata y Copa Estímulo · ordenado por día y horario' : 'Semifinales, final y tercer puesto');
    return '<div class="wrap">' +
      '<div class="section">' +
        '<div class="section-head"><h2 class="section-title">Fixture</h2><span class="section-note">' + esc(groupNote) + '</span></div>' +
        renderFixtureSection(cat) +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><h2 class="section-title">Posiciones</h2><span class="section-note">Tabla de cada zona</span></div>' +
        renderStandingsSection(cat) +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><h2 class="section-title">' + esc(crossTitle) + '</h2><span class="section-note">' + esc(crossNote) + '</span></div>' +
        renderCrossings(cat) +
      '</div>' +
    '</div>';
  }

  /* ---------------- "¿Cómo se juega?" explainer ---------------- */
  function renderModalidad(cat){
    var picker = STATE.categories.map(function(c){
      return '<button class="mod-cat-btn" role="tab" aria-selected="' + (c.id===cat.id) + '" data-action="modalidad-select-category" data-id="' + c.id + '" type="button">' + esc(c.name) + '</button>';
    }).join('');
    var body;
    if(cat.format==='cruce2zonas') body = renderModalidadCruce(cat);
    else if(cat.format==='copas5zonas') body = renderModalidadCopas(cat);
    else if(cat.format==='copas4zonas') body = renderModalidadCopas4(cat);
    else body = '<p class="empty-note">Todavía no hay una explicación cargada para el formato de esta categoría.</p>';
    return '<div class="section">' +
      '<div class="section-head"><h2 class="section-title">¿Cómo se juega?</h2></div>' +
      '<div class="mod-cat-picker">' + picker + '</div>' +
      body +
    '</div>';
  }

  // Esquema visual del cruce de posiciones (1° vs 2° cruzados, 3° vs 4°
  // cruzados, 5° vs 5° directo) — misma lógica que buildBracketSpecs para
  // el formato 'cruce2zonas', mostrada como diagrama en el explicador.
  function renderCruceDiagram(nameA, nameB){
    var rowY = [70, 130, 190, 250, 310];
    var pairs = [[0,1],[1,0],[2,3],[3,2],[4,4]]; // índice de fila A -> índice de fila B conectada
    var boxes = '';
    var badges = '';
    var lines = '';
    for(var i=0;i<5;i++){
      var top = rowY[i] - 20;
      boxes += '<rect class="cd-box" x="10" y="' + top + '" width="220" height="40" rx="8"></rect>';
      boxes += '<rect class="cd-box" x="670" y="' + top + '" width="220" height="40" rx="8"></rect>';
      badges += '<rect class="cd-badge-bg" x="245" y="' + top + '" width="50" height="40" rx="8"></rect>';
      badges += '<text class="cd-badge-text" x="270" y="' + rowY[i] + '">' + (i+1) + '°</text>';
      badges += '<rect class="cd-badge-bg" x="605" y="' + top + '" width="50" height="40" rx="8"></rect>';
      badges += '<text class="cd-badge-text" x="630" y="' + rowY[i] + '">' + (i+1) + '°</text>';
    }
    pairs.forEach(function(p){
      var y1 = rowY[p[0]], y2 = rowY[p[1]];
      var cls = p[0]===p[1] ? 'cd-line-straight' : 'cd-line';
      lines += '<line class="' + cls + '" x1="295" y1="' + y1 + '" x2="605" y2="' + y2 + '"></line>';
    });
    return '<svg class="cross-diagram" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Esquema de cruce: 1° vs 2° cruzados, 3° vs 4° cruzados, 5° vs 5° directo">' +

  // formato 'copas4zonas', coloreada por copa para que se entienda de un vistazo.
  function renderCruceDiagramCopas4Pair(nameLeft, nameRight){
    var rowY = [70, 130, 190, 250, 310];
    var pairs = [[0,1],[1,0],[2,3],[3,2],[4,4]];
    var copaByRow = ['oro','oro','plata','plata','estimulo'];
    var boxes = '';
    var badges = '';
    var lines = '';
    for(var i=0;i<5;i++){
      var top = rowY[i] - 20;
      var copa = copaByRow[i];
      boxes += '<rect class="cd-box" x="10" y="' + top + '" width="220" height="40" rx="8"></rect>';
      boxes += '<rect class="cd-box" x="670" y="' + top + '" width="220" height="40" rx="8"></rect>';
      badges += '<rect class="cd-badge-bg cd-badge-' + copa + '" x="245" y="' + top + '" width="50" height="40" rx="8"></rect>';
      badges += '<text class="cd-badge-text cd-badge-text-' + copa + '" x="270" y="' + rowY[i] + '">' + (i+1) + '°</text>';
      badges += '<rect class="cd-badge-bg cd-badge-' + copa + '" x="605" y="' + top + '" width="50" height="40" rx="8"></rect>';
      badges += '<text class="cd-badge-text cd-badge-text-' + copa + '" x="630" y="' + rowY[i] + '">' + (i+1) + '°</text>';
    }
    pairs.forEach(function(p, i){
      var y1 = rowY[p[0]], y2 = rowY[p[1]];
      var copa = copaByRow[i];
      var cls = (p[0]===p[1] ? 'cd-line-straight ' : 'cd-line ') + 'cd-line-' + copa;
      lines += '<line class="' + cls + '" x1="295" y1="' + y1 + '" x2="605" y2="' + y2 + '"></line>';
    });
    return '<svg class="cross-diagram" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cruce ' + esc(nameLeft) + ' con ' + esc(nameRight) + ': 1° y 2° a Copa Oro, 3° y 4° a Copa Plata, 5° a Copa Estímulo">' +

      '<text class="cd-col-label" x="780" y="24">' + esc(nameRight) + '</text>' +
      lines + boxes + badges +

  }

  function renderPartidosList(cat){
    var out = '';
    cat.zones.forEach(function(z){
      var gm = groupMatches(cat, z.id);
      if(!gm.length) return;
      out += '<h4 style="margin:14px 0 4px;font-size:13px;color:var(--ink-muted)">' + esc(z.name) + '</h4>';
      out += gm.map(function(m){ return adminMatchRow(m, m.matchNum ? ('Partido ' + m.matchNum + ' · Fase de grupos') : 'Fase de grupos'); }).join('');
    });
    if(cat.format==='cruce2zonas' || cat.format==='copas5zonas' || cat.format==='copas4zonas'){
      var specs = buildBracketSpecs(cat) || [];
      var groupNames = {llave:'Llave de posiciones', oro:'Copa Oro', plata:'Copa Plata', estimulo:'Copa Estímulo'};
      var seenGroups = [];
      specs.forEach(function(s){ if(seenGroups.indexOf(s.group)===-1) seenGroups.push(s.group); });
      seenGroups.forEach(function(gk){
        out += '<h4 style="margin:14px 0 4px;font-size:13px;color:var(--ink-muted)">' + esc(groupNames[gk]||gk) + '</h4>';
        out += specs.filter(function(s){ return s.group===gk; }).map(function(s){
          var m = cat.matches.find(function(x){ return x.key===s.key; });
          if(!m) return '';
          return adminMatchRow(m, 'Partido ' + s.key + ' · ' + s.round);
        }).join('');
      });
    } else {
      var semis = cat.matches.filter(function(m){ return m.stage==='semifinal'; });
      if(semis.length){
        out += '<h4 style="margin:14px 0 4px;font-size:13px;color:var(--ink-muted)">Semifinales</h4>';
        out += semis.map(function(m,i){ return adminMatchRow(m, 'Semifinal ' + (i+1)); }).join('');
      }
      var final = cat.matches.find(function(m){ return m.stage==='final'; });
      var tercer = cat.matches.find(function(m){ return m.stage==='tercer'; });
      if(final || tercer){
        out += '<h4 style="margin:14px 0 4px;font-size:13px;color:var(--ink-muted)">Cruces finales</h4>';
        if(final) out += adminMatchRow(final, 'Final');
        if(tercer) out += adminMatchRow(tercer, 'Tercer puesto');
      }
    }
    if(!out) out = '<p class="empty-note">Esta categoría todavía no tiene partidos. Cargá los equipos en la pestaña "Equipos".</p>';
    return out;
  }
